<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>1b的奇妙人生</title>
<style>
:root{--ink:#1b1b2f;--bg:#fff8e7;--g:#3ec43e;--y:#ffcc00;--o:#ff8a00;--r:#e8343a;--gr:#9a9aaa;--blue:#3a7bd5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#2b2d5a;color:var(--ink);font-family:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei",monospace;font-weight:700}
body{background-image:linear-gradient(45deg,#2f3166 25%,transparent 25%,transparent 75%,#2f3166 75%),linear-gradient(45deg,#2f3166 25%,transparent 25%,transparent 75%,#2f3166 75%);background-size:16px 16px;background-position:0 0,8px 8px;min-height:100vh}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 0 4px var(--ink);padding-bottom:96px;position:relative}
.px{border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:4px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);padding:10px 14px;font-size:17px;min-height:48px}
button:active{transform:translate(4px,4px);box-shadow:none}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--ink);color:#fff}
header h1{margin:0;font-size:20px;letter-spacing:2px;flex:1}
header .d{font-size:13px;color:var(--y)}
.back{background:var(--y);min-height:40px;padding:4px 12px;font-size:16px;box-shadow:3px 3px 0 #000;border-color:#000;color:var(--ink)}
main{padding:14px}
.alert{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.alert button{display:flex;flex-direction:column;align-items:center;padding:8px 4px;font-size:14px}
.alert b{font-size:28px;line-height:1.1}
.a-red{background:#ffd6d6}.a-or{background:#ffe7c2}.a-gr{background:#e4e4ea}
.a-zero{opacity:.45}
.todo{background:var(--y);padding:10px 12px;margin-bottom:14px;font-size:16px}

/* global lock v5 */
.lk{display:flex;align-items:center;gap:6px;background:var(--y);min-height:48px;padding:4px 10px 4px 6px;font-size:14px;box-shadow:3px 3px 0 #000;border-color:#000;color:var(--ink);flex:none}
.lk img{width:30px;height:30px;image-rendering:pixelated}.lk.un{background:var(--g)}
.lkmini{background:var(--y);min-height:40px;width:44px;padding:2px;box-shadow:3px 3px 0 #000;border-color:#000;flex:none}.lkmini img{width:26px;height:26px;image-rendering:pixelated;display:block;margin:auto}.lkmini.un{background:var(--g)}
.qv{flex:none;text-align:center;font-size:18px;min-width:44px}.qv .u{display:block;font-size:10px;color:#667;font-weight:400}
.locknote{background:#e4e4ea;border:3px dashed var(--ink);padding:8px 10px;font-size:14px;margin:0 0 12px}
.lockmask{position:fixed;inset:0;background:rgba(27,27,47,.8);display:flex;align-items:center;justify-content:center;z-index:1100;padding:20px}
.lockbox{background:var(--bg);border:4px solid var(--ink);box-shadow:8px 8px 0 #000;padding:20px;width:100%;max-width:360px;text-align:center}
.lockbox h2{margin:0 0 6px;font-size:22px}.lockbox p{margin:0 0 14px;font-size:14px;color:#555}
.lockbox input{width:100%;font:inherit;font-size:20px;padding:12px;border:4px solid var(--ink);margin-bottom:14px;text-align:center}
.lockbox .go{width:100%;background:var(--g);font-size:22px;min-height:60px}
.lockbox .x{margin-top:12px;background:#fff;font-size:15px;min-height:40px;width:100%}
.lockbox .err{color:var(--r);min-height:20px;font-size:15px;margin-bottom:6px}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.shake{animation:shk .4s steps(4)}
/* fridge */
.scene{display:flex;gap:14px;justify-content:center;align-items:flex-end;margin:6px 0 4px}
.fridge{width:200px;background:#dfe9f2;padding:6px;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);position:relative}
.door{position:relative;display:block;width:100%;background:#f4f8fb;border:4px solid var(--ink);box-shadow:inset -8px -8px 0 #c6d4e0,inset 6px 6px 0 #fff;text-align:left;padding:12px 10px;transform-origin:left center;transition:transform .45s steps(6);margin:0}
.door:active{transform:none;box-shadow:inset -8px -8px 0 #c6d4e0}
.door.open{transform:perspective(500px) rotateY(-75deg)}
.door .lbl{font-size:20px;display:block}.door .n{font-size:14px;color:#556}
.door .handle{position:absolute;right:12px;top:50%;width:10px;height:40px;margin-top:-20px;background:var(--gr);border:3px solid var(--ink)}
.d-frz{height:120px;margin-bottom:6px}.d-frz .lbl{color:var(--blue)}
.d-cold{height:200px}.d-cold .lbl{color:#178a5a}
.feet{display:flex;justify-content:space-between;padding:0 14px}.feet i{width:20px;height:10px;background:var(--ink)}
.shelf{width:130px;background:#c98b4a;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:8px;text-align:center;box-shadow:inset 0 -6px 0 #9a6430,6px 6px 0 var(--ink)}
.shelf .lbl{font-size:20px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.shelf .n{font-size:14px;color:#fff3}
.shelf .rows i{display:block;height:8px;background:#7a4a20;margin:30px 0 0}
.shelf .n{color:#fff}
.dot{display:inline-block;min-width:22px;padding:0 4px;text-align:center;background:var(--r);color:#fff;font-size:13px;border:2px solid var(--ink);margin-left:4px}
.hint{text-align:center;color:#667;font-size:14px;margin:14px 0 0}
/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tabs button{padding:8px 2px;font-size:17px}
.tabs .on{background:var(--ink);color:#fff}
.sec{font-size:16px;margin:16px 0 8px;padding:4px 10px;background:var(--ink);color:#fff;display:inline-block}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px}
.chips button{flex:none;padding:4px 10px;min-height:38px;font-size:15px;box-shadow:3px 3px 0 var(--ink);border-width:3px}
.chips .on{background:var(--y)}
.row{display:flex;align-items:center;gap:10px;background:#fff;padding:8px;margin-bottom:10px;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.row.out,.scard.out{opacity:.55;background:#eee}
.row .ico{width:48px;height:48px;flex:none;border:3px solid var(--ink);background:#fff}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12px;color:#556;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-block;font-size:12px;padding:1px 6px;border:2px solid var(--ink);margin-top:3px}
.s-ok{background:#b8f0b8}.s-soon{background:var(--y)}.s-past{background:var(--o)}.s-bad{background:var(--r);color:#fff}.s-out{background:#bbb}.s-low{background:#ffe7c2}
.tag{display:inline-block;font-size:11px;padding:0 4px;margin:3px 0 0 3px;border:2px solid var(--r);color:var(--r);background:#fff}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:44px;height:44px;min-height:44px;padding:0;font-size:24px;line-height:1;box-shadow:3px 3px 0 var(--ink);border-width:3px}
.step .q{min-width:34px;text-align:center;font-size:18px;cursor:pointer;border-bottom:3px dashed var(--ink);padding:2px 2px 0}
.numbox input{font-size:34px!important;font-weight:700}.numbox .u2{font-size:16px;margin:-8px 0 12px;color:#556}.numbox .two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.numbox .two2 button{min-height:60px;font-size:20px}
.bk{width:44px;height:44px;flex:none;border:4px solid var(--ink);background:#fff;font-size:28px;line-height:36px;text-align:center;font-weight:700}.bk.on{background:var(--y)}.row.sel{background:#fff6c0}
.btop{display:flex;gap:8px;margin:0 0 12px}.btop button{flex:1;min-height:52px;font-size:18px}.btop .on{background:var(--y)}
.bbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:var(--ink);color:var(--y);padding:8px;z-index:1001;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.bbar .cnt{grid-column:1/-1;text-align:center;font-size:18px;padding:2px 0}.bbar button{min-height:54px;padding:0 2px;font-size:16px}.bbar button:disabled{opacity:.4}
.toast .ud{margin-left:12px;background:var(--y);color:var(--ink);min-height:36px;font-size:16px;padding:4px 10px;border:3px solid var(--y)}
@media(min-width:900px){.bbar{max-width:560px}}
.step .u{display:block;font-size:10px;color:#667;font-weight:400}
/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--ink);padding:6px;gap:5px;z-index:5}
nav button{font-size:13px;padding:4px 1px;min-height:56px;min-width:0;white-space:nowrap;border-color:#000;box-shadow:3px 3px 0 #000;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
nav button span{font-size:22px;height:26px;display:flex;align-items:center}
nav button span img{width:30px;height:23px;image-rendering:pixelated}
nav .on{background:var(--y)}
nav .big{background:var(--g)}
/* detail */
.card{background:#fff;padding:14px;margin-bottom:14px}
.hero{display:flex;gap:14px;align-items:center}
.hero canvas{width:96px;height:96px;border:4px solid var(--ink);flex:none}
.hero h2{margin:0;font-size:22px}.hero .o{font-size:13px;color:#667;font-weight:400;margin-top:4px}
.big-st{font-size:20px;padding:10px;text-align:center;margin:14px 0 0}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:8px 8px;font-size:15px;margin-top:12px}.kv div:nth-child(odd){color:#667}
.kv div:nth-child(even){font-weight:400}
details{margin-top:12px;border:3px solid var(--ink);padding:8px}
summary{font-size:15px;cursor:pointer}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.primary{background:var(--g);width:100%;font-size:19px}
.danger{background:#ffd6d6}
.note{font-size:12px;color:#778;font-weight:400;margin-top:10px}
/* form */
label{display:block;font-size:15px;margin:10px 0 4px}
input,select,textarea{font:inherit;font-size:17px;width:100%;padding:10px;border:4px solid var(--ink);background:#fff;font-weight:400;border-radius:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:16px;margin:12px 0}.check input{width:24px;height:24px}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--ink);color:var(--y);padding:12px 18px;z-index:1050;border:4px solid var(--y);font-size:16px}
.empty{text-align:center;color:#667;padding:24px;font-size:16px}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.3}}
@media(min-width:900px){#app{max-width:560px}nav{max-width:560px}}
/* ===== BOOK v1 ===== */
.bookbar{display:flex;justify-content:flex-end;margin:-4px 0 8px}
.bookbtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff3d6;padding:6px 10px 4px;min-width:96px;min-height:72px;box-shadow:4px 4px 0 var(--ink)}
.bookbtn img{image-rendering:pixelated;width:68px;height:51px;animation:bob 2.4s steps(4) infinite}
.bookbtn span{font-size:14px;color:#7a2e1c}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.rbook{margin:10px 0;background:#8b3a1e;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:0}
.rbook .pg{background:#fff4d8;min-height:300px;padding:16px 12px;background-image:repeating-linear-gradient(#fff4d8 0 26px,#ead9b0 26px 28px);border:3px solid #5a2410}
.rbook .pg.l{border-right:2px dashed #b08a5a;box-shadow:inset -8px 0 0 #f0e0b8}.rbook .pg.r{box-shadow:inset 8px 0 0 #f0e0b8}
.rbook h2{margin:0 0 8px;font-size:20px;color:#8b3a1e;text-align:center}
.rempty{text-align:center;font-size:16px;color:#6b4a2a;margin-top:30px;line-height:1.8}
.rempty canvas{image-rendering:pixelated;width:100px;height:75px;display:block;margin:0 auto 10px}
#recipeList:empty{display:none}

/* ===== RECIPES v1 ===== */
.rbook.one{grid-template-columns:1fr}.rbook.one .pg{min-height:0}
.rcard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px;margin:0 0 12px;font:inherit;cursor:pointer}
.rcard .ri{font-size:34px;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:#ffe9b0;border:3px solid var(--ink);flex:none}
.rcard .rn{font-size:18px;color:#1b1b2f}.rcard .rm{font-size:13px;color:#667;font-weight:400;margin-top:3px}
.rcard .rb{margin-left:auto;font-size:13px;padding:4px 6px;border:3px solid var(--ink);flex:none;white-space:nowrap}
.rb.ok{background:#7be08a}.rb.no{background:#ffb4a8}
.rcard.din{background:#fff3d6}
.rh{font-size:20px;color:#8b3a1e;margin:18px 0 8px;border-bottom:4px solid #8b3a1e;padding-bottom:4px}
.rtop{text-align:center}.rtop .big{font-size:48px}.rtop h2{margin:4px 0;font-size:22px;color:#8b3a1e}
.rchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}.rchips span{background:#fff;border:3px solid var(--ink);padding:3px 8px;font-size:14px}
.rpre{background:#fff7b0;border:3px dashed var(--ink);padding:8px;font-size:15px;margin-top:8px}
.ritem{display:flex;gap:8px;align-items:flex-start;font-size:16px;padding:7px 0;border-bottom:2px dotted #c9b48a}
.ritem .ck{flex:none;width:26px;text-align:center}.ritem .q{margin-left:auto;text-align:right;font-weight:400;color:#333}
.ritem .use{display:block;font-size:13px;color:#6b4a2a;font-weight:400;margin-top:2px}
.rstep{display:flex;gap:10px;width:100%;text-align:left;font:inherit;font-size:19px;line-height:1.45;background:#fff;border:3px solid var(--ink);padding:10px;margin:0 0 8px;cursor:pointer}
.rstep b{flex:none;width:34px;height:34px;background:var(--ink);color:var(--y);display:flex;align-items:center;justify-content:center;font-size:18px}
.rstep.done{background:#d8f5dc;color:#889;text-decoration:line-through}.rstep.done b{background:#178a5a;color:#fff}
.gt{border:4px solid var(--ink);background:#fff;padding:8px 6px;overflow:hidden}
.gr{display:grid;grid-template-columns:7.2em 1fr;align-items:center;gap:6px;margin:3px 0}
.gr .gl{font-size:13px;line-height:1.2;text-align:right}
.gr .gb{position:relative;height:24px;background:repeating-linear-gradient(90deg,#f3eee0 0 calc(10% - 1px),#ddd3b8 calc(10% - 1px) 10%)}
.gr .gb i{position:absolute;top:2px;bottom:2px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-style:normal;font-size:11px;color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;text-shadow:1px 1px 0 #000}
.gax{display:grid;grid-template-columns:7.2em 1fr;gap:6px;font-size:11px;color:#667}.gax div:last-child{position:relative;height:14px}.gax span{position:absolute;transform:translateX(-50%)}
.gleg{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;margin-top:8px}.gleg span::before{content:'';display:inline-block;width:12px;height:12px;border:2px solid var(--ink);background:var(--c);margin-right:4px;vertical-align:-2px}
.rhealth{background:#e6f4ff;border:3px solid var(--ink);padding:10px;font-size:15px;line-height:1.6;margin-top:14px}
.rsrc{font-size:14px;margin:12px 0 4px}.rsrc a{color:#8b3a1e}
@media (prefers-reduced-motion:reduce){.bookbtn img{animation:none}}

/* ===== COOKWARE v1 ===== */
.cwstrip{display:flex;gap:6px;justify-content:space-between;background:#fff3d6;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 6px;margin:0 0 14px}
.cwstrip h3{display:none}.cw{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;text-align:center;flex:1}
.cw img{width:40px;height:40px;image-rendering:pixelated;background:#fff;border:2px solid var(--ink)}
.cwt{font-size:15px;margin:2px 0 6px;color:#8b3a1e}.rtools{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.rtools span{display:flex;align-items:center;gap:4px;background:#fff3d6;border:3px solid var(--ink);padding:2px 6px;font-size:14px}.rtools img{width:22px;height:22px;image-rendering:pixelated}
.gr .gl img{width:14px;height:14px;image-rendering:pixelated;vertical-align:-2px;margin-right:2px}
.rspice{background:#fff3d6;border:3px solid var(--ink);padding:8px;font-size:14px;line-height:1.6;margin:10px 0}.rsum{border:3px solid var(--ink);background:#fff;padding:8px;margin-top:14px}.rsum summary{font-size:16px;cursor:pointer;font-weight:bold}.opt{color:#a0602a}
/* ===== v5: rack / recipe book ===== */
.scene2{display:grid;grid-template-columns:min(176px,48vw) min(132px,36vw);column-gap:12px;row-gap:0;justify-content:center;align-items:stretch}
.scene2 .fridge{width:auto;margin:0;box-sizing:border-box}.scene2 .shelf{width:auto;margin:0;box-sizing:border-box;height:100%}
.scene2 .feet{padding:0 14px}
.rack{display:block;width:auto;margin:0 10px;min-height:48px;padding:3px 6px 0;background:#e9c48e;border:4px solid var(--ink);border-bottom:none;box-shadow:4px 0 0 var(--ink);text-align:left;box-sizing:border-box}
.rack .rlbl{display:flex;align-items:center;gap:6px;font-size:15px;margin:0 0 2px;white-space:nowrap}.rack .rlbl small{font-size:12px;color:#5a3a1a}
.scene2 .rack .rshelf{min-height:26px;margin-bottom:0;border-bottom-width:6px;padding:0 2px}.scene2 .rack .rshelf img{width:22px;height:22px}
.bookstand{}.bookstand .rlbl{justify-content:center}.scene2 .bshelf{display:flex;justify-content:center;align-items:flex-end}.scene2 .bookstand .bshelf img{width:34px;height:26px;image-rendering:pixelated}
.cubby{display:flex!important;flex-direction:column;align-items:stretch;padding:6px!important;background:#c8914f!important;gap:4px}.cubby .lbl{font-size:15px;white-space:nowrap;text-align:center}.cubby .n{text-align:center;font-size:13px}
.cgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:4px;background:#5a3a1a;padding:4px;border:3px solid var(--ink)}
.cgrid i{background:#f4e2c0;box-shadow:inset 3px 3px 0 #a8743c;display:flex;align-items:center;justify-content:center;min-height:30px;font-style:normal;font-size:14px;font-weight:bold}.cgrid img{width:36px;height:36px;image-rendering:pixelated}.cgrid .more{background:#ffe066}
.rshelf{display:flex;gap:4px;justify-content:space-between;align-items:flex-end;padding:0 4px;border-bottom:8px solid #7a4a20;margin-bottom:8px;min-height:44px}
.rshelf img{width:38px;height:38px;image-rendering:pixelated;background:transparent}
.rshelf .more{font-size:13px;align-self:center;color:#5a3a1a}
.scard{display:flex;gap:10px;align-items:flex-start;background:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px;margin-bottom:12px}
.scard .ico{width:60px;height:60px;border:3px solid var(--ink);image-rendering:pixelated;flex:none}
.scard .mid{flex:1;min-width:0;cursor:pointer}.scard .nm{font-size:18px}.scard .o{font-size:12px;color:#778;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .ln{font-size:14px;font-weight:400;margin-top:3px;line-height:1.4}.scard .ln b{font-weight:700}
.cold{display:inline-block;font-size:12px;padding:1px 6px;border:2px solid var(--blue);color:var(--blue);margin:3px 0 0 3px;background:#eef4ff}
.uses{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.uses button{min-height:32px;padding:2px 6px;font-size:12px;border-width:2px;box-shadow:2px 2px 0 var(--ink);background:#fff3d6}

// ---------- shelf life ----------
function days(a,b){return Math.round((b-a)/864e5)}
function life(it){
 if(it.qty<=0)return{k:'out',t:'用完了',c:'s-out',left:null};
 const r=DB.rules[it.rule]||{u:[30,60],o:[7,14]},[bb,mx]=it.opened?r.o:r.u;
 const d0=new Date(it.intake+'T00:00:00'),age=days(d0,TODAY),lb=bb-age,lm=mx-age;
 const soon=Math.min(14,Math.max(2,Math.round(bb*.2)));
 if(lm<0)return{k:'bad',t:'可能过期',c:'s-bad',left:lm,lb,lm,bb,mx,age};
 if(lb<0)return{k:'past',t:'过了最佳赏味期',c:'s-past',left:lm,lb,lm,bb,mx,age};
 if(lb<=soon)return{k:'soon',t:'尽快吃',c:'s-soon',left:lb,lb,lm,bb,mx,age};
 return{k:'ok',t:'新鲜',c:'s-ok',left:lb,lb,lm,bb,mx,age};
}
function stLabel(L,it){if(L.k==='out')return'用完了';
 const d=L.k==='ok'||L.k==='soon'?L.lb:L.lm;
 const tx=d>=60?Math.round(d/30)+'个月':d+'天';
 if(L.k==='bad')return'可能过期 · 超'+(-L.lm)+'天';
 if(L.k==='past')return'过赏味期 · 最多还'+tx;
 return L.t+' · 还'+tx+(it.low?' · 快用完':'')}

const FKEY='shenchu-fit',FIT0={target:1800,prot:130,fat:60,carb:200,wkTarget:4,log:{},combos:[],wk:{}};
let FIT;try{FIT=Object.assign({},FIT0,JSON.parse(localStorage.getItem(FKEY)||'{}'))}catch(e){FIT=JSON.parse(JSON.stringify(FIT0))}
function fsave(){localStorage.setItem(FKEY,JSON.stringify(FIT))}
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const MEALS={breakfast:'🌅 早餐',lunch:'☀️ 午餐',dinner:'🌙 晚餐',snack:'🍌 加餐'};
function curMeal(){const h=new Date().getHours();return h<10?'breakfast':h<15?'lunch':h<21?'dinner':'snack'}
function dayLog(d=dk()){return FIT.log[d]||[]}
function sumL(L){const t={kcal:0,p:0,f:0,c:0,unk:0};L.forEach(e=>{t.kcal+=e.kcal||0;t.p+=e.p||0;t.f+=e.f||0;t.c+=e.c||0;if(e.f==null||e.c==null)t.unk++});['p','f','c'].forEach(k=>t[k]=Math.round(t[k]*10)/10);t.kcal=Math.round(t.kcal);return t}
function streak(){let n=0;const d=new Date();for(let i=0;i<14;i++){const k=dk(d);if((FIT.log[k]||[]).length||(FIT.wk[k]||[]).length)n++;else if(i>0)break;d.setDate(d.getDate()-1)}return n}
function blocks(v,max,cls){const n=10,f=Math.min(n,Math.round(v/max*n));return`<span class="blk ${cls}">${Array.from({length:n},(_,i)=>`<i class="${i<f?'on':''}${v>max&&i===n-1?' over':''}"></i>`).join('')}</span>`}
function mbar(t,v,max,unit,col){return`<div class="mrow"><span class="ml">${t}</span>${blocks(v,max,col)}<span class="bdg mv"><b>${v}/${max}${unit}</b></span></div>`}
function nextTpl(){const T=EMBED.fit.templates.filter(t=>t.kind==='strength');let last=null;Object.keys(FIT.wk).sort().forEach(k=>FIT.wk[k].forEach(w=>{if(T.some(t=>t.id===w.tpl))last=w.tpl}));const i=T.findIndex(t=>t.id===last);return T[(i+1)%T.length]}
function weekDone(){const d=new Date();let n=0;for(let i=0;i<7;i++){n+=(FIT.wk[dk(d)]||[]).filter(w=>w.kind==='strength').length;d.setDate(d.getDate()-1)}return n}
function entryRow(e){return`<div class="swr fe" data-fid="${e.id}"><div class="row lrow"><div class="mid"><div class="nm">${esc(e.name)}</div><div class="bdgs"><span class="bdg kb"><i class="bi">🔥</i><b>${e.kcal??'?'} kcal</b></span><span class="bdg"><b>蛋白 ${e.p??'?'}</b></span><span class="bdg"><b>脂 ${e.f??'?'}</b></span><span class="bdg"><b>碳 ${e.c??'?'}</b></span></div></div>${unlocked()?`<button class="hvd" onclick="fitDel('${e.id}')" aria-label="删除">🗑️</button>`:''}</div></div>`}
function vToday(){const L=dayLog(),t=sumL(L),left=FIT.target-t.kcal,nt=nextTpl(),wd=(FIT.wk[dk()]||[]);
 return head('1b的奇妙人生',0,1)+`<main>

 <div class="sl2">${left>=0?`还能吃 <b>${left}</b> kcal`:`超了 <b>${-left}</b> kcal`} · 目标 = 静息 2000 − 200</div>
 ${mbar('蛋白',t.p,FIT.prot,'g','bl')}${mbar('脂肪',t.f,FIT.fat,'g','ye')}${mbar('碳水',t.c,FIT.carb,'g','gr')}${t.unk?`<div class="note">有 ${t.unk} 条缺脂肪/碳水数据，没算进去</div>`:''}</div>
 <button class="primary hard" onclick="go('eat')">🍽 记一顿</button>
 ${Object.keys(MEALS).map(m=>{const ml=L.filter(e=>e.meal===m);return`<div class="rh">${MEALS[m]} <small class="mk">${ml.length?sumL(ml).kcal+' kcal':'还没记'}</small></div>${m==='breakfast'&&!ml.length?`<button class="primary bfb" onclick="bfLog()">🍳 记早餐 · 固定早餐 ${sumL(BFC.items).kcal} kcal</button>`:''}${ml.map(entryRow).join('')}`}).join('')}
 <div class="rh">🏋️ 今天的训练</div>
 ${wd.length?wd.map(w=>`<div class="rpre" style="background:#b8f0b8">✅ 做完：${esc((EMBED.fit.templates.find(t=>t.id===w.tpl)||{}).name||w.tpl)}</div>`).join(''):''}

 else body=`<div class="card px"><label>名字</label><input id="c-n" placeholder="例如：一个苹果"><div class="two"><div><label>热量 kcal</label><input id="c-k" type="number" inputmode="decimal"></div><div><label>蛋白 g</label><input id="c-p" type="number" inputmode="decimal"></div></div><div class="two"><div><label>脂肪 g</label><input id="c-f" type="number" inputmode="decimal"></div><div><label>碳水 g</label><input id="c-c" type="number" inputmode="decimal"></div></div><button class="primary" onclick="customAdd()">＋ 记下</button></div>`;
 return head('🍽 记一顿',1)+`<main><div class="chips mealc" id="mealc">${Object.keys(MEALS).map(m=>`<button class="${m===meal?'on':''}" onclick="state.meal='${m}';render.keep=1;render.anchor='#mealc';render();render.keep=0">${MEALS[m]}</button>`).join('')}</div>
 <div class="chips etabs" id="etabs">${Object.keys(T).map(k=>`<button class="${k===tab?'on':''}" onclick="go('eat/${k}')">${T[k]}</button>`).join('')}</div>${unlocked()?'':'<div class="rpre">🔒 只能看：记饭要先点左上角首页的锁解锁</div>'}${body}</main>`+navbar('today')}
function fitAddE(e){e.id='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);e.meal=e.meal||state.meal||curMeal();const k=dk();(FIT.log[k]=FIT.log[k]||[]).push(e);fsave();return e}

/* ---- 8 位像素小人：FitFlow 的骨架算法 + 低分辨率逐像素画线 ---- */
const rad=d=>d*Math.PI/180,limbDir=a=>[Math.sin(rad(a)),Math.cos(rad(a))],upDir=t=>[Math.sin(rad(t)),-Math.cos(rad(t))],padd=(p,d,k=1)=>[p[0]+d[0]*k,p[1]+d[1]*k];
function solve(root,limb,la,lb,def){if('a' in limb){const j=padd(root,limbDir(limb.a),la);return[j,padd(j,limbDir(limb.b),lb)]}
 const dx=limb.to[0]-root[0],dy=limb.to[1]-root[1],d=Math.min(la+lb-.01,Math.max(Math.abs(la-lb)+.01,Math.hypot(dx,dy))),base=Math.atan2(dy,dx),off=Math.acos((la*la+d*d-lb*lb)/(2*la*d)),ang=base+(limb.bend??def)*off;
 return[[root[0]+la*Math.cos(ang),root[1]+la*Math.sin(ang)],[root[0]+d*Math.cos(base),root[1]+d*Math.sin(base)]]}
function skel(p,mv){const wide=mv.mode!=='side',sw=wide?13:0,hw=wide?8:0,up=upDir(p.torso),ac=[Math.cos(rad(p.torso)),Math.sin(rad(p.torso))],hMid=p.hip,sMid=padd(hMid,up,LB.torso);
 const sN=padd(sMid,ac,sw),sF=padd(sMid,ac,-sw),hN=padd(hMid,ac,hw),hF=padd(hMid,ac,-hw),hd=upDir(p.torso+(p.head||0)),sh=p.headShift||[0,0],head=padd(padd(sMid,hd,LB.neck+LB.headR),sh),neck=padd(head,hd,-LB.headR);
 const leg=(r,l,ft)=>{const[k,a]=solve(r,l,LB.thigh,LB.shin,-1);return{knee:k,ankle:a,toe:padd(a,limbDir(ft??90),LB.foot)}},arm=(r,l)=>{const[e,h]=solve(r,l,LB.upper,LB.fore,1);return{elbow:e,hand:h}};
 return{head,neck,sN,sF,hN,hF,sMid,hMid,near:Object.assign(leg(hN,p.nearLeg,p.nearFoot),arm(sN,p.nearArm)),far:Object.assign(leg(hF,p.farLeg,p.farFoot),arm(sF,p.farArm))}}
const lerp=(a,b,t)=>a+(b-a)*t,lp=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t)];
function mixLimb(a,b,t){if('a' in a&&'a' in b)return{a:lerp(a.a,b.a,t),b:lerp(a.b,b.b,t)};if('to' in a&&'to' in b)return{to:lp(a.to,b.to,t),bend:a.bend};return t<.5?a:b}
function mix(a,b,t){const o=Object.assign({},t<.5?a:b);o.hip=lp(a.hip,b.hip,t);o.torso=lerp(a.torso,b.torso,t);o.head=lerp(a.head||0,b.head||0,t);o.headShift=lp(a.headShift||[0,0],b.headShift||[0,0],t);
 ['nearLeg','farLeg','nearArm','farArm'].forEach(k=>o[k]=mixLimb(a[k],b[k],t));['nearFoot','farFoot'].forEach(k=>o[k]=lerp(a[k]??90,b[k]??90,t));return o}
function mfDraw(cv,mv,pose){const vb=(mv.viewBox||'0 0 220 150').split(' ').map(Number),S=2,W=Math.round(vb[2]/S),H=Math.round(vb[3]/S);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
 const x=cv.getContext('2d'),img=x.createImageData(W,H),d=img.data;const P=(px,py,c)=>{px=Math.round(px);py=Math.round(py);if(px<0||py<0||px>=W||py>=H)return;const i=(py*W+px)*4;d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255};
 const T=p=>[(p[0]-vb[0])/S,(p[1]-vb[1])/S];const line=(a,b,c,w=2)=>{a=T(a);b=T(b);const n=Math.ceil(Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1])))+1;for(let i=0;i<=n;i++){const px=lerp(a[0],b[0],i/n),py=lerp(a[1],b[1],i/n);for(let u=0;u<w;u++)for(let v=0;v<w;v++)P(px+u-(w>>1),py+v-(w>>1),c)}};
 const disc=(p,r,c)=>{p=T(p);for(let u=-r;u<=r;u++)for(let v=-r;v<=r;v++)if(u*u+v*v<=r*r+r)P(p[0]+u,p[1]+v,c)};
 const INK=[27,27,47],FAR=[150,150,175],SKIN=[255,214,170],DB=[200,60,40],PROP=[160,110,60],MAT=[90,170,120];
 line([vb[0],FLOOR],[vb[0]+vb[2],FLOOR],[120,120,120],1);
 (mv.props||[]).forEach(p=>{if(p.kind==='mat')line([30,FLOOR-1],[190,FLOOR-1],MAT,2);if(p.kind==='table'){line([p.x1,p.y],[p.x2,p.y],PROP,2);line([p.x1+4,p.y],[p.x1+4,FLOOR],PROP,1);line([p.x2-4,p.y],[p.x2-4,FLOOR],PROP,1)}
  if(p.kind==='wall')line([60,0],[60,FLOOR],PROP,3);if(p.kind==='chair'){line([p.x,p.top],[p.x,FLOOR],PROP,2);line([p.x,p.seat],[p.x+p.dir*26,p.seat],PROP,2);line([p.x+p.dir*26,p.seat],[p.x+p.dir*26,FLOOR],PROP,1)}if(p.kind==='roller')disc(p.at,3,PROP);if(p.kind==='bench'){for(let y=110;y<=115;y++)line([86,y],[150,y],[200,60,40],1);line([86,116],[150,116],INK,1);line([94,116],[94,FLOOR],INK,2);line([142,116],[142,FLOOR],INK,2);line([88,FLOOR],[100,FLOOR],INK,2);line([136,FLOOR],[148,FLOOR],INK,2)}});
 const k=skel(pose,mv),side=(s,c)=>{line(s===k.far?k.hF:k.hN,s.knee,c);line(s.knee,s.ankle,c);if(!pose.hideShins)line(s.ankle,s.toe,c);line(s===k.far?k.sF:k.sN,s.elbow,c);line(s.elbow,s.hand,c)};
 side(k.far,mv.mode==='side'?FAR:INK);line(k.hMid,k.sMid,INK,3);if(mv.mode!=='side'){line(k.sN,k.sF,INK);line(k.hN,k.hF,INK)}line(k.sMid,k.neck,INK);side(k.near,INK);disc(k.head,4,INK);disc(k.head,2,SKIN);
 (mv.props||[]).forEach(p=>{if(p.kind==='db'){const hs=p.at==='both'?[k.near.hand,k.far.hand]:[p.at==='near'?k.near.hand:k.far.hand];hs.forEach(h=>disc(h,2,DB))}if(p.kind==='goblet')disc(lp(k.near.hand,k.far.hand,.5),3,DB)});
 x.putImageData(img,0,0)}
const MF=new Map();
function mfScan(){document.querySelectorAll('canvas.mf').forEach(cv=>{if(MF.has(cv))return;const mv=MOVES[cv.dataset.mv];if(!mv)return;MF.set(cv,{mv,t0:performance.now()})});if(!window.__mfLoop){window.__mfLoop=1;requestAnimationFrame(mfTick)}}
function mfTick(now){for(const[cv,o]of MF){if(!cv.isConnected){MF.delete(cv);continue}const F=o.mv.frames,ms=o.mv.ms||1100,hold=ms*.35,seg=ms+hold,pos=(Math.max(0,now-o.t0)%(seg*F.length))/seg,i=Math.min(F.length-1,Math.floor(pos)),f=pos-i,t=Math.max(0,Math.min(1,(f*seg-hold)/ms));
 const a=F[i%F.length],b=F[(i+1)%F.length],tt=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;mfDraw(cv,o.mv,mix(a,b,tt));const sy=document.querySelector(`.say[data-say="${cv.dataset.mv}"]`);if(sy&&cv.classList.contains('big'))sy.textContent=(t<.5?a:b).say||''}
