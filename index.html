    toast(`已记 ${kcal} kcal`, '撤销', () => {
      if (typeof removeEntries === 'function') removeEntries(day, ids);
      renderAll();
    });
  }
}

function openSettings() {
  const setVal = (id, v) => {
    const el = document.getElementById(id);
    if (el) el.value = v ?? '';
  };
  setVal('set-target', r0(FIT.target || 1800));
  setVal('set-prot', r0(FIT.prot || 140));
  setVal('set-fat', r0(FIT.fat || 55));
  setVal('set-carb', r0(FIT.carb || 185));

  clearLegacyKeys();
  setVal('set-token', (SY && SY.cfg && SY.cfg.token) || '');

  const repoEl = document.getElementById('sync-repo');
  if (repoEl && typeof syRepo === 'function') repoEl.textContent = syRepo();

  const statusEl = document.getElementById('sync-status');
  if (statusEl) {
    statusEl.textContent = typeof syncStatusText === 'function'
      ? syncStatusText()
      : (!syOn() ? '仅本机' : (SY.state === 'ok' ? '已同步' : '同步中…'));
  }

  const backdrop = document.getElementById('sheet-backdrop');
  const sheet = document.getElementById('settings-sheet');
  if (backdrop) backdrop.classList.add('is-open');
  if (sheet) {
    sheet.classList.add('is-open');
    sheet.setAttribute('aria-hidden', 'false');
  }
  document.body.style.overflow = 'hidden';
}

function closeSettings() {
  const backdrop = document.getElementById('sheet-backdrop');
  const sheet = document.getElementById('settings-sheet');
  if (backdrop) backdrop.classList.remove('is-open');
  if (sheet) {
    sheet.classList.remove('is-open');
    sheet.setAttribute('aria-hidden', 'true');
  }
  document.body.style.overflow = '';
}

function saveSettings() {
  const readPos = (id, fallback) => {
    const el = document.getElementById(id);
    if (!el) return fallback;
    const v = r0(parseFloat(el.value));
    return (Number.isFinite(v) && v > 0) ? v : fallback;
  };

  const nextTarget = readPos('set-target', FIT.target);
  const nextProt = readPos('set-prot', FIT.prot);
  const nextFat = readPos('set-fat', FIT.fat);
  const nextCarb = readPos('set-carb', FIT.carb);
  const tgtChanged = nextTarget !== FIT.target || nextProt !== FIT.prot || nextFat !== FIT.fat || nextCarb !== FIT.carb;
  if (tgtChanged) {
    FIT.target = nextTarget;
    FIT.prot = nextProt;
    FIT.fat = nextFat;
    FIT.carb = nextCarb;
    FIT.tgtV = Date.now();
  }

  clearLegacyKeys();

  const tkEl = document.getElementById('set-token');
  if (tkEl && SY && SY.cfg) {
    const tkVal = tkEl.value.trim();
    if (tkVal) SY.cfg.token = tkVal;
    else delete SY.cfg.token;
    lsTry(SKEY, JSON.stringify(SY.cfg));
  }

  if (tgtChanged) fsave();
  closeSettings();
  renderAll();
  if (typeof updateSyncUI === 'function') updateSyncUI();
  if (typeof syOn === 'function' && syOn()) syRun();
  toast('已保存');
}

function bindEvents() {
  if (typeof window.toast === 'function' && !window.toast._wrapped) {
    const origToast = window.toast;
    const wrapped = function (text, btnText, fn, ms) {
      _lastToastFn = typeof fn === 'function' ? fn : null;
      return origToast.apply(this, arguments);
    };
    wrapped._wrapped = true;
    window.toast = wrapped;
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    switch (act) {
      case 'tab':
        setTab(el.dataset.v);
        break;
      case 'open-settings':
        openSettings();
        break;
      case 'close-settings':
        closeSettings();
        break;
      case 'save-settings':
        saveSettings();
        break;
      case 'sync-now': {
        const tkEl = document.getElementById('set-token');
        if (tkEl && SY && SY.cfg) {
          const tk = tkEl.value.trim();
          if (tk) SY.cfg.token = tk;
          else delete SY.cfg.token;
          lsTry(SKEY, JSON.stringify(SY.cfg));
        }
        if (typeof updateSyncUI === 'function') updateSyncUI();
        if (typeof syOn === 'function' && syOn()) {
          syRun();
        } else {
          toast('先填 Token');
        }
        break;
      }
      case 'toast': {
        const fn = (UI && typeof UI.toastFn === 'function') ? UI.toastFn : (_lastToastFn || TOAST_FN);
        if (UI) UI.toastFn = null;
        _lastToastFn = null;
        TOAST_FN = null;
        const toastEl = document.getElementById('toast');
        if (toastEl) toastEl.classList.remove('is-show');
        if (typeof fn === 'function') fn();
        break;
      }
      case 'day-prev':
        CUR_DAY = _shiftDayStr(CUR_DAY, -1);
        UI.preview = [];
        UI.editEntry = null;
        renderToday();
        break;
      case 'day-next': {
        const today = dayKey(new Date());
        if (CUR_DAY < today) {
          const next = _shiftDayStr(CUR_DAY, 1);
          CUR_DAY = next > today ? today : next;
          UI.preview = [];
          UI.editEntry = null;
          renderToday();
        }
        break;
      }
      case 'day-today':
        CUR_DAY = dayKey(new Date());
        UI.preview = [];
        UI.editEntry = null;
        renderToday();
        break;
      case 'meal':
        UI.meal = el.dataset.v;
        renderToday();
        break;
      case 'cook-mode': {
        const mode = el.dataset.v;
        if (!['raw','cooked'].includes(mode)) break;
        FIT.cookMode = mode;
        UI.preview.forEach((it, i) => {
          if (!setItemMode(it, mode)) return;
          delete UI.drafts['pv-' + i];
          if (UI.autoCalories) delete UI.autoCalories['pv-' + i];
        });
        fsave(); renderToday();
        break;
      }
      case 'pv-mode': {
        const i = Number(el.dataset.i), it = UI.preview[i];
        if (it && setItemMode(it, el.dataset.v)) {
          delete UI.drafts['pv-' + i];
          if (UI.autoCalories) delete UI.autoCalories['pv-' + i];
          renderToday();
        }
        break;
      }
      case 'custom-toggle':
        UI.customOpen = !UI.customOpen;
        renderToday();
        if (UI.customOpen) {
          setTimeout(() => {
            const el = document.getElementById('cf-name');
            if (el) el.focus();
          }, 50);
        }
        break;
      case 'custom-cancel':
        UI.customOpen = false; UI.customDraft = {name:'',g:100}; delete UI.drafts.cf; if (UI.autoCalories) delete UI.autoCalories.cf; renderToday();
        break;
      case 'custom-save-db-toggle':
        UI.customSaveDb = !UI.customSaveDb; renderToday();
        break;
      case 'custom-auto':
        autoKcal('cf', true);
        break;
      case 'custom-submit':
        submitCustomFood();
        break;
      case 'entry-save-macros':
        saveEntryMacros(el.dataset.id);
        break;
      case 'pv-macros': {
        const i = Number(el.dataset.i), it = UI.preview[i]; if (!it) break;
        if (it.editMacros && !syncPreviewMacros(i)) break;
        it.editMacros = !it.editMacros; renderToday();
        break;
      }
      case 'parse':
        doParse();
        break;
      case 'pv-step':
        if (UI.preview[Number(el.dataset.i)]?.editMacros && !syncPreviewMacros(Number(el.dataset.i))) break;
        delete UI.drafts['pv-' + el.dataset.i];
        if (typeof pvStep === 'function') pvStep(Number(el.dataset.i), Number(el.dataset.v));
        renderToday();
        break;
      case 'pv-del':
        if (Array.isArray(UI.preview)) {
          for (let i = Number(el.dataset.i); i < UI.preview.length; i++) {
            UI.drafts['pv-' + i] = UI.drafts['pv-' + (i + 1)];
          }
          UI.preview.splice(Number(el.dataset.i), 1);
          renderToday();
        }
        break;
      case 'pv-cancel':
        UI.preview = [];
        renderToday();
        break;
      case 'pv-commit':
        commitPreview();
        break;
      case 'combo':
        logCombo(el.dataset.v);
        break;
      case 'entry':
        UI.editEntry = UI.editEntry === el.dataset.id ? null : el.dataset.id;
        renderToday();
        break;
      case 'e-step': {
        const list = (FIT.log && FIT.log[CUR_DAY]) || [];
        const entry = list.find(x => x.id === el.dataset.id);
        if (entry && Number(entry.grams) > 0) {
          const nextG = Math.max(10, r0(Number(entry.grams) + Number(el.dataset.v)));
          const pending = readMacros('entry-' + entry.id); if (!pending) break;
          Object.assign(entry, pending); delete UI.drafts['entry-' + entry.id];
          if (typeof scaleEntry === 'function') scaleEntry(entry, nextG);
          fsave();
          renderToday();
        }
        break;
      }
      case 'e-meal': {
        const list = (FIT.log && FIT.log[CUR_DAY]) || [];
        const entry = list.find(x => x.id === el.dataset.id);
        if (entry && el.dataset.v) {
          entry.meal = el.dataset.v;
          fsave();
          renderToday();
        }
        break;
      }
      case 'e-mode': {
        const hit = findEntry(el.dataset.id);
        if (hit && setItemMode(hit.e, el.dataset.v)) {
          const prefix = 'entry-' + hit.e.id;
          delete UI.drafts[prefix];
          if (UI.autoCalories) delete UI.autoCalories[prefix];
          fsave(); renderToday();
        }
        break;
      }
      case 'e-del': {
        const day = CUR_DAY;
        const list = (FIT.log && FIT.log[day]) || [];
        const idx = list.findIndex(x => x.id === el.dataset.id);
        if (idx >= 0) {
          const snap = Object.assign({}, list[idx]);
          list.splice(idx, 1);
          if (UI.editEntry === snap.id) UI.editEntry = null;
          fsave();
          renderToday();
          toast('已删', '撤销', () => {
            const arr = FIT.log[day] || (FIT.log[day] = []);
            if (!arr.some(x => x.id === snap.id)) {
              arr.splice(Math.min(idx, arr.length), 0, snap);
              fsave();
              renderToday();
            }
          });
        }
        break;
      }
      case 'trend-toggle':
        UI.trendOpen = !UI.trendOpen;
        renderToday();
        break;
      case 'trend-days':
        UI.trendDays = Number(el.dataset.v) === 7 ? 7 : 14;
        renderToday();
        break;
      case 'sf':
        UI.stockFilter = el.dataset.v;
        UI.editItem = null;
        if (UI.stockFilter !== 'spice' && UI.stockFilter !== '调料') {
          UI.spiceManage = false;
        }
        renderStock();
        break;
      case 'spice-manage':
        UI.spiceManage = !UI.spiceManage;
        if (!UI.spiceManage) UI.editItem = null;
        renderStock();
        break;
      case 's-toggle':
        toggleStock(el.dataset.id);
        break;
      case 's-edit':
        UI.editItem = UI.editItem === el.dataset.id ? null : el.dataset.id;
        renderStock();
        break;
      case 's-edit-save':
      case 'stock-edit-done': {
        const item = itemById(el.dataset.id);
        const macros = readMacros('stock-' + el.dataset.id, true);
        if (macros === null) break;
        if (macros && item) { item.nut = {...macros,fb:Number(item.nut && item.nut.fb) || 0}; stockChanged(); }
        delete UI.drafts['stock-' + el.dataset.id];
        const id = el.dataset.id;
        const inp = document.querySelector(`.stock-edit-input[data-id="${id}"]`);
        if (inp && id) {
          const val = inp.value.trim();
          if (val && typeof renameItem === 'function') {
            renameItem(id, val);
          } else {
            const it = DB.items.find(x => x.id === id);
            if (it && val && val !== uiName(it.name)) {
              it.name = val;
              if (typeof stockChanged === 'function') stockChanged();
              else bump();
            }
          }
        }
        UI.editItem = null;
        renderAll();
        break;
      }
      case 's-cat':
        if (typeof setItemCat === 'function') {
          setItemCat(el.dataset.id, el.dataset.v);
        }
        renderAll();
        break;
      case 's-del': {
        const id = el.dataset.id;
        const idx = DB.items.findIndex(x => x.id === id);
        if (idx >= 0) {
          const snap = Object.assign({}, DB.items[idx]);
          if (typeof deleteItem === 'function') {
            deleteItem(id);
          } else {
            DB.items.splice(idx, 1);
            if (typeof stockChanged === 'function') stockChanged();
            else bump();
          }
          if (UI.editItem === id) UI.editItem = null;
          renderAll();
          toast(`已删 ${uiName(snap.name)}`, '撤销', () => {
            if (!DB.items.some(x => x.id === snap.id)) {
              DB.items.splice(Math.min(idx, DB.items.length), 0, snap);
              if(typeof SY!=='undefined'&&SY.st&&SY.st.recs){SY.st.recs['i:'+snap.id]={h:syHash(snap),u:Date.now()};lsTry(STKEY,JSON.stringify(SY.st));}
              if (typeof stockChanged === 'function') stockChanged();
              else bump();
              renderAll();
            }
          });
        }
        break;
      }
      case 's-add-open': {
        UI.addOpen = !UI.addOpen;
        if (UI.addOpen) UI.stockNewName = UI.stockQuery || '';
        renderStock();
        if (UI.addOpen) document.getElementById('stock-new-name')?.focus();
        break;
      }
      case 's-add-cat':
        UI.addCat = el.dataset.v || 'veg';
        renderStock();
        break;
      case 's-add-cancel':
        UI.stockNewName = ''; delete UI.drafts['stock-new'];
        UI.addOpen = false;
        renderStock();
        break;
      case 's-add-submit':
        submitNewStock();
        break;
      case 's-add': {
        const q = (UI.stockQuery || '').trim();
        if (q && typeof addItem === 'function') {
          const it = addItem(q);
          UI.stockQuery = '';
          const searchEl = document.getElementById('stock-search');
          if (searchEl) searchEl.value = '';
          renderAll();
          if (it) {
            toast(`已加 ${uiName(it.name)}`, '撤销', () => {
              const curIdx = DB.items.findIndex(x => x.id === it.id);
              if (curIdx >= 0) {
                if (typeof deleteItem === 'function') deleteItem(it.id);
                else {
                  DB.items.splice(curIdx, 1);
                  if (typeof stockChanged === 'function') stockChanged();
                  else bump();
                }
                renderAll();
              }
            });
          }
        }
        break;
      }
      case 'cf':
        UI.cookFilter = el.dataset.v;
        renderCook();
        break;
      case 'pot':
        UI.pot = el.dataset.v;
        renderCook();
        break;
      case 'r-open': {
        const rid = el.dataset.id;
        UI.openRecipe = UI.openRecipe === rid ? null : rid;
        renderCook();
        if (UI.openRecipe) {
          const openCard = document.querySelector('#recipe-list .recipe-card.is-open');
          if (openCard && typeof openCard.scrollIntoView === 'function') {
            openCard.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        }
        break;
      }
      case 'r-log':
        logRecipe(el.dataset.id);
        break;
      case 'formula-toggle':
        UI.formulaOpen = !UI.formulaOpen;
        renderCook();
        break;
    }
  });

  document.addEventListener('input', e => {
    const input = e.target;
    if (input.dataset.prefix && input.dataset.macro) {
      const prefix = input.dataset.prefix;
      if (input.dataset.macro === 'kcal' && UI.autoCalories) delete UI.autoCalories[prefix];
      const draft = UI.drafts[prefix] || (UI.drafts[prefix] = {});
      for (const [k] of MACROS) draft[k] = document.getElementById(prefix + '-' + k)?.value ?? '';
    }
    if (input.id === 'cf-name') UI.customDraft.name = input.value;
    if (input.id === 'cf-g') UI.customDraft.g = input.value;
    if (input.id === 'stock-new-name') UI.stockNewName = input.value;
  });
  document.addEventListener('focusout', e => {
    const input = e.target;
    if (input.dataset.macro && input.dataset.macro !== 'kcal') autoKcal(input.dataset.prefix);
  });

  // 非点击事件绑定
  const foodInput = document.getElementById('food-input');
  if (foodInput) {
    foodInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        doParse();
      }
    });
  }

  const stockAddPanel = document.getElementById('stock-add-panel');
  if (stockAddPanel) {
    stockAddPanel.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target && e.target.id === 'stock-new-name') {
        e.preventDefault();
        submitNewStock();
      }
    });
  }

  const stockSearch = document.getElementById('stock-search');
  if (stockSearch) {
    stockSearch.addEventListener('input', (e) => {
      UI.stockQuery = e.target.value;
      renderStock();
    });
    stockSearch.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const q = (UI.stockQuery || '').trim();
        if (q && !DB.items.some(i => uiName(i.name) === q)) {
          e.preventDefault();
          const it = (typeof addItem === 'function') ? addItem(q) : null;
          UI.stockQuery = '';
          stockSearch.value = '';
          renderAll();
          if (it) {
            toast(`已加 ${uiName(it.name)}`, '撤销', () => {
              const curIdx = DB.items.findIndex(x => x.id === it.id);
              if (curIdx >= 0) {
                if (typeof deleteItem === 'function') deleteItem(it.id);
                else {
                  DB.items.splice(curIdx, 1);
                  if (typeof stockChanged === 'function') stockChanged();
                  else bump();
                }
                renderAll();
              }
            });
          }
        }
      }
    });
  }

  ['wt-input', 'act-input'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('change', () => saveBody());
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        el.blur();
      }
    });
  });

  const stockListEl = document.getElementById('stock-list');
  if (stockListEl) {
    stockListEl.addEventListener('input', e => {
      if (e.target.classList.contains('stock-edit-input')) {
        UI.stockNames = UI.stockNames || {}; UI.stockNames[e.target.dataset.id] = e.target.value;
      }
    });
    stockListEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target && e.target.classList && e.target.classList.contains('stock-edit-input')) {
        e.preventDefault();
        const button = stockListEl.querySelector(`[data-act="stock-edit-done"][data-id="${e.target.dataset.id}"]`);
        e.target.blur(); button?.click();
      }
    });
  }

  window.addEventListener('hashchange', () => {
    if (typeof route === 'function') route();
    renderAll();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      const nowDay = dayKey(new Date());
      if (nowDay !== UI.todayKey) {
        TODAY.setTime(new Date().setHours(0, 0, 0, 0));
        if (CUR_DAY === UI.todayKey) CUR_DAY = nowDay;
        UI.todayKey = nowDay;
      }
      renderAll();
      if (typeof syOn === 'function' && syOn()) syRun();
    }
  });
}

function boot() {
  if (typeof syStamp === 'function') syStamp();
  if (!UI.meal && typeof curMeal === 'function') UI.meal = curMeal();
  bindEvents();
  if (typeof route === 'function') route();
  renderAll();
  if (typeof syOn === 'function' && syOn()) syRun();
}

boot();
</script>
</body>
</html>
