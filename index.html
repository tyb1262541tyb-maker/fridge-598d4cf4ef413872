// ---------- shelf life ----------
function days(a,b){return Math.round((b-a)/864e5)}
function life(it){
 if(it.qty<=0)return{k:'out',t:'用完了',c:'s-out',left:null};
 const r=DB.rules[it.rule]||{u:[30,60],o:[7,14]},[bb,mx]=it.opened?r.o:r.u;
 const d0=new Date(it.intake+'T00:00:00'),age=days(d0,TODAY),lb=bb-age,lm=mx-age;
 const soon=Math.min(14,Math.max(2,Math.round(bb*.2)));
 if(lm<0)return{k:'bad',t:'可能过期',c:'s-bad',left:lm,lb,lm,bb,mx,age};
 if(lb<0)return{k:'past',t:'过了最佳赏味期',c:'s-past',left:lm,lb,lm,bb,mx,age};
 if(lb<=soon)return{k:'soon',t:'尽快吃',c:'s-soon',left:lb,lb,lm,bb,mx,age};
 return{k:'ok',t:'新鲜',c:'s-ok',left:lb,lb,lm,bb,mx,age};
}
function stLabel(L,it){if(L.k==='out')return'用完了';
 const d=L.k==='ok'||L.k==='soon'?L.lb:L.lm;
 const tx=d>=60?Math.round(d/30)+'个月':d+'天';
 if(L.k==='bad')return'可能过期 · 超'+(-L.lm)+'天';
 if(L.k==='past')return'过赏味期 · 最多还'+tx;
 return L.t+' · 还'+tx+(it.low?' · 快用完':'')}

function icon(it,size){const key=it.sprite+it.c1+it.c2+size;if(ICACHE[key])return ICACHE[key];
 const s=(SP[it.sprite]||SP.box).padEnd(144,'.'),c=document.createElement('canvas'),n=12,pad=2,px=Math.floor(size/(n+pad*2));
 c.width=c.height=size;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,size,size);
 const off=Math.floor((size-px*n)/2),pal={k:'#1b1b2f',a:it.c1||'#999',b:it.c2||'#555',w:'#ffffff'};
 for(let i=0;i<144;i++){const ch=s[i];if(ch==='.')continue;g.fillStyle=pal[ch];g.fillRect(off+(i%n)*px,off+Math.floor(i/n)*px,px,px)}

window.exportDB=()=>copy('#神厨库存 '+JSON.stringify({v:DB.version,edited:DB.edited||'',items:DB.items.map(i=>[i.id,i.name,i.zone,i.qty,i.unit,i.intake,i.opened?1:0,i.low?1:0])}));
window.importDB=()=>{let t=$('#imp').value.trim().replace(/^#神厨库存\s*/,'');try{const d=JSON.parse(t);
 if(d.items&&d.items[0]&&!Array.isArray(d.items[0])){localStorage.setItem(KEY+'-backup-'+DB.version+'-导入前',JSON.stringify(DB));d.rules=EMBED.rules;DB=d;save();toast('✅ 导入成功');go('')}else{toast('❌ 这是导出码，不是完整数据')}}catch(e){toast('❌ 代码格式不对')}};

function vForm(id){const it=id?byId(id):{name:'',orig:'',zone:'冷藏',kind:'食材',group:'肉禽',qty:1,unit:'个',intake:new Date().toISOString().slice(0,10),opened:false,rule:''};
 const opt=(arr,v)=>arr.map(a=>`<option ${a===v?'selected':''}>${a}</option>`).join('');
 return head(id?'✏️ 编辑':'➕ 添加',1)+`<main><div class="card px">
 <label>名称</label><input id="f-name" value="${esc(it.name)}" placeholder="例如：猪蹄">
 <div class="two"><div><label>位置</label><select id="f-zone">${opt(['冷冻','冷藏','常温'],it.zone)}</select></div>
 <div><label>类型</label><select id="f-kind" onchange="document.getElementById('f-group').innerHTML=(this.value==='调料'?FLAVORS:FGROUPS).map(a=>'<option>'+a+'</option>').join('')">${opt(['食材','调料'],it.kind)}</select></div></div>
 <label>分类 / 风味</label><select id="f-group">${opt(it.kind==='调料'?FLAVORS:FGROUPS,it.group)}</select>
 <div class="two"><div><label>数量</label><input id="f-qty" type="number" min="0" step="1" value="${it.qty}"></div><div><label>单位</label><input id="f-unit" value="${esc(it.unit)}"></div></div>
 <label>入库日期</label><input id="f-date" type="date" value="${it.intake}">
 <label class="check"><input id="f-open" type="checkbox" ${it.opened?'checked':''}> 已开封</label>
 <details><summary>更多（可不填）</summary><label>原名 / 俄文</label><input id="f-orig" value="${esc(it.orig)}">
 ${''}<label>适合什么菜</label><input id="f-style" value="${esc(it.style||'')}"><label>味道</label><input id="f-taste" value="${esc(it.taste||'')}"></details>
 <div style="height:14px"></div><button class="primary" onclick="saveForm('${id||''}')">💾 保存</button></div></main>`+navbar(id?'':'add')}
const AUTO={冷冻:{肉禽:'frozen_meat',海鲜:'frozen_sea',冷冻加工:'frozen_proc'},冷藏:{蛋奶:'milk',蔬菜:'radish',肉禽:'deli',海鲜:'deli',腌菜罐头:'pickle'},常温:{蔬菜:'rootveg',主食:'noodle',腌菜罐头:'pickle'}};
const SPR={肉禽:['beef','#c8443a','#fff'],海鲜:['shrimp','#f07050','#fff'],冷冻加工:['nugget','#e0a040','#a06a20'],蛋奶:['milk','#4a8ad9','#fff'],蔬菜:['potato','#c8a060','#8a6a30'],腌菜罐头:['jar','#4a8a2a','#c8e070'],主食:['noodle','#f2d070','#c8442c'],
 咸鲜:['bottle','#6b3a1e','#e8c020'],甜:['sugar','#fff','#cfd8e8'],酸:['bottle','#e8d8a0','#c8442c'],辣:['jar','#c8321e','#e8c020'],麻:['pepper','#a0401e','#2a5a1a'],辛香料:['powder','#9a5a2a','#e8c020'],香草:['leaf','#4f9a3a','#2f6b25'],复合调味:['packet','#e8a020','#c8442c'],油脂:['oil','#f2d040','#2a7a3a'],酒香:['bottle','#c89a50','#c8442c'],'勾芡/其他':['bag','#f0f0f0','#4a8ad9']};
window.saveForm=id=>{const v=k=>document.getElementById('f-'+k).value.trim();if(!v('name')){toast('请填名称');return}
 let it=id?byId(id):null;const isNew=!it;if(!it){it={id:'u'+Date.now().toString(36),tags:[],nut:null,low:false};DB.items.push(it)}
 const grpChanged=it.group!==v('group');
 Object.assign(it,{name:v('name'),zone:v('zone'),kind:v('kind'),group:v('group'),qty:Math.max(0,+v('qty')||0),unit:v('unit')||'个',intake:v('date')||new Date().toISOString().slice(0,10),opened:document.getElementById('f-open').checked,orig:v('orig')||v('name'),style:v('style'),taste:v('taste')});
 if(isNew||grpChanged||!it.rule){it.rule=it.kind==='调料'?(it.zone==='冷藏'?'sauce':'blend'):((AUTO[it.zone]||{})[it.group]||'deli');}
 if(isNew||grpChanged){const s=SPR[it.group]||['box','#999','#555'];[it.sprite,it.c1,it.c2]=s}
 bump();toast('💾 已保存');go('item/'+it.id)};
function render(){const h=decodeURIComponent(location.hash.slice(1)),[v,a]=h.split('/');let out;
 if(v==='zone')out=vZone(a);else if(v==='item')out=vItem(a);else if(v==='shop')out=vShop();else if(v==='intake')out=vIntake();else if(v==='add')out=vForm();else if(v==='edit')out=vForm(a);else if(v==='alert')out=vAlert(a);else if(v==='recipes')out=vRecipes();else if(v==='recipe')out=vRecipe(a);else if(v==='dinner')out=vDinner();else out=vHome();
 $('#app').innerHTML=out;if(v!=='zone'||!render.keep)window.scrollTo(0,0)}
/* ===== QTY+BATCH v1 ===== */
function fmtQ(n){return +(+n).toFixed(2)}
function parseQ(t){t=String(t).trim().replace(',','.').replace('，','.');if(!/^\d*\.?\d+$|^\d+\.$/.test(t))return null;return Math.max(0,fmtQ(parseFloat(t)))}
window.parseQ=parseQ;
function setQ(it,n){const was=it.qty;it.qty=Math.max(0,fmtQ(n));if(it.qty>0&&was<=0)it.low=false}
function numDlg(title,unit,val,cb){if(document.querySelector('.lockmask'))return;const m=document.createElement('div');m.className='lockmask';
 m.innerHTML=`<div class="lockbox numbox px"><h2>${esc(title)}</h2><div class="err" id="nerr"></div><input id="nin" type="text" inputmode="decimal" autocomplete="off" value="${val}"><div class="u2">${esc(unit||'')}</div><div class="two2"><button class="x" id="nx" style="margin:0;min-height:60px">取消</button><button class="go" id="ngo">确定</button></div></div>`;
 document.body.appendChild(m);const inp=m.querySelector('#nin');setTimeout(()=>{inp.focus();inp.select()},50);
 const ok=()=>{const n=parseQ(inp.value);if(n===null){m.querySelector('#nerr').textContent='❌ 请输入数字，比如 2 或 0.5';inp.select();return}m.remove();cb(n)};
 m.querySelector('#ngo').onclick=ok;inp.onkeydown=e=>{if(e.key==='Enter')ok();if(e.key==='Escape')m.remove()};m.querySelector('#nx').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()}}
window.numEdit=id=>{const it=byId(id);numDlg('✏️ '+it.name,it.unit,it.qty,n=>setQty(id,n))};
window.setQty=(id,n)=>{const it=byId(id);setQ(it,n);bump();toast(it.name+' → '+(it.qty<=0?'用完了':it.qty+' '+it.unit));render()};
let UNDO=null;
function toastU(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;const b=document.createElement('button');b.className='ud';b.textContent='↩ 撤销';b.onclick=()=>{d.remove();undo()};d.appendChild(b);document.body.appendChild(d);setTimeout(()=>d.remove(),6000)}
window.undo=()=>{if(!UNDO)return;DB.items=JSON.parse(UNDO);UNDO=null;bump();toast('↩ 已撤销');render()};
function snap(){UNDO=JSON.stringify(DB.items)}
window.batchT=()=>{state.batch=!state.batch;state.sel.clear();render.keep=1;render();render.keep=0};
window.selT=id=>{state.sel.has(id)?state.sel.delete(id):state.sel.add(id);render.keep=1;render();render.keep=0};
window.selAll=z=>{const ids=DB.items.filter(i=>i.zone===z).map(i=>i.id);if(ids.every(i=>state.sel.has(i)))state.sel.clear();else ids.forEach(i=>state.sel.add(i));render.keep=1;render();render.keep=0};
function selItems(){return DB.items.filter(i=>state.sel.has(i.id))}
window.bOp=(op,v)=>{const L=selItems();if(!L.length)return;
 if(op==='del'&&!confirm('确定删除这 '+L.length+' 样？\n'+L.map(i=>'· '+i.name).join('\n')))return;
 snap();if(op==='add')L.forEach(it=>setQ(it,it.qty+v));else if(op==='set')L.forEach(it=>setQ(it,v));else if(op==='out')L.forEach(it=>setQ(it,0));else if(op==='del'){DB.items=DB.items.filter(i=>!state.sel.has(i.id));state.sel.clear()}
 bump();render.keep=1;render();render.keep=0;toastU(op==='add'?L.length+' 样 '+(v>0?'+':'')+v:op==='set'?L.length+' 样 → '+v:op==='out'?L.length+' 样已用完':'🗑️ 已删 '+L.length+' 样')};
window.bSet=()=>{const n=state.sel.size;if(!n)return;numDlg('设为… （'+n+' 样）','',1,v=>bOp('set',v))};
window.shopT=id=>{state.ssel.has(id)?state.ssel.delete(id):state.ssel.add(id);render.keep=1;render();render.keep=0};
window.shopAll=()=>{const L=DB.items.filter(i=>i.qty<=0||i.low).map(i=>i.id);if(L.every(i=>state.ssel.has(i)))state.ssel.clear();else L.forEach(i=>state.ssel.add(i));render.keep=1;render();render.keep=0};
window.buyMany=()=>{const L=DB.items.filter(i=>state.ssel.has(i.id));if(!L.length)return;snap();const d=new Date().toISOString().slice(0,10);L.forEach(it=>{it.qty=Math.max(1,it.qty);it.low=false;it.intake=d;it.opened=false});state.ssel.clear();bump();render();toastU('✅ '+L.length+' 样已入库')};

/* ===== EDIT-LOCK v1 ===== */
const LOCK={"salt": "ac064f339cb9f8d1807aa5bd2a64fc8f", "iter": 100000, "hash": "c8047f259ebc866be760ead755075cf0b86cab2c91537858c01c371b7bfede23"},LKS='shenchu-unlocked';
function unlocked(){return sessionStorage.getItem(LKS)===LOCK.hash}
function LOCKBTN(){return unlocked()?`<button class="lk un" onclick="relock()">🔓 上锁</button>`:`<button class="lk" onclick="askUnlock()" aria-label="解锁编辑">🔒</button>`}
function hx(b){return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function checkPw(pw){const salt=new Uint8Array(LOCK.salt.match(/../g).map(h=>parseInt(h,16)));
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:LOCK.iter},k,256);return hx(b)===LOCK.hash}
window.checkPw=checkPw;
let pending=null;
window.askUnlock=(after)=>{pending=typeof after==='function'?after:null;if(document.querySelector('.lockmask'))return;
 const m=document.createElement('div');m.className='lockmask';m.innerHTML=`<div class="lockbox px"><h2>🔒 输入密码</h2><p>密码对了才能修改库存</p><div class="err" id="lkerr"></div><input id="lkpw" type="password" autocomplete="current-password" placeholder="密码"><button class="go" id="lkgo">解锁</button><button class="x" id="lkx">取消</button></div>`;
 document.body.appendChild(m);const inp=m.querySelector('#lkpw');setTimeout(()=>inp.focus(),50);
 const close=()=>{m.remove();if(location.hash==='#unlock')history.replaceState(null,'',location.pathname)};
 const tryIt=async()=>{if(!inp.value)return;if(await checkPw(inp.value)){sessionStorage.setItem(LKS,LOCK.hash);close();applyLock();toast('🔓 已解锁');const f=pending;pending=null;if(f)f();else render()}
  else{const b=m.querySelector('.lockbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');m.querySelector('#lkerr').textContent='❌ 密码不对';inp.value='';inp.focus()}};
 m.querySelector('#lkgo').onclick=tryIt;inp.onkeydown=e=>{if(e.key==='Enter')tryIt()};m.querySelector('#lkx').onclick=()=>{pending=null;close()}};
window.relock=()=>{sessionStorage.removeItem(LKS);applyLock();toast('🔒 已上锁');render()};
function applyLock(){document.body.classList.toggle('locked',!unlocked())}
['qty','toggle','del','bought','importDB','restore','saveForm','numEdit','setQty','batchT','bOp','bSet','buyMany','undo'].forEach(n=>{const f=window[n];window[n]=(...a)=>{if(unlocked())return f(...a);askUnlock(()=>f(...a))}});
const _render=render;render=function(){const h=decodeURIComponent(location.hash.slice(1)),v=h.split('/')[0];
 if(h==='unlock'){if(!unlocked()){location.hash.length;history.replaceState(null,'','#');_render();applyLock();askUnlock();return}history.replaceState(null,'','#')}
 if((v==='add'||v==='edit')&&!unlocked()){const t=h;history.replaceState(null,'','#');_render();applyLock();askUnlock(()=>go(t));return}
 _render();applyLock()};
(function(){const q=new URLSearchParams(location.search);if(q.get('t')==='batch'){state.batch=true;(q.get('sel')||'').split(',').filter(Boolean).forEach(i=>state.sel.add(i))}
 if(q.get('t')==='shop'){(q.get('sel')||'').split(',').filter(Boolean).forEach(i=>state.ssel.add(i))}
 if(q.get('t')==='num')setTimeout(()=>{const it=byId(q.get('id'));numDlg('✏️ '+it.name,it.unit,it.qty,()=>{})},100)})();
render();
