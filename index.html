<!DOCTYPE html><html lang="zh-CN"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8">

<title>神厨冰箱</title>
<style>
:root{--ink:#1b1b2f;--bg:#fff8e7;--g:#3ec43e;--y:#ffcc00;--o:#ff8a00;--r:#e8343a;--gr:#9a9aaa;--blue:#3a7bd5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#2b2d5a;color:var(--ink);font-family:"Noto Sans CJK SC","Noto Sans SC","PingFang SC","Microsoft YaHei",monospace;font-weight:700}
body{background-image:linear-gradient(45deg,#2f3166 25%,transparent 25%,transparent 75%,#2f3166 75%),linear-gradient(45deg,#2f3166 25%,transparent 25%,transparent 75%,#2f3166 75%);background-size:16px 16px;background-position:0 0,8px 8px;min-height:100vh}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 0 4px var(--ink);padding-bottom:96px;position:relative}
.px{border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:4px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink);padding:10px 14px;font-size:17px;min-height:48px}
button:active{transform:translate(4px,4px);box-shadow:none}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--ink);color:#fff}
header h1{margin:0;font-size:20px;letter-spacing:2px;flex:1}
header .d{font-size:13px;color:var(--y)}
.back{background:var(--y);min-height:40px;padding:4px 12px;font-size:16px;box-shadow:3px 3px 0 #000;border-color:#000;color:var(--ink)}
main{padding:14px}
.alert{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.alert button{display:flex;flex-direction:column;align-items:center;padding:8px 4px;font-size:14px}
.alert b{font-size:28px;line-height:1.1}
.a-red{background:#ffd6d6}.a-or{background:#ffe7c2}.a-gr{background:#e4e4ea}
.a-zero{opacity:.45}
.todo{background:var(--y);padding:10px 12px;margin-bottom:14px;font-size:16px}

/* edit lock */
.lk{background:var(--y);min-height:40px;padding:4px 10px;font-size:16px;box-shadow:3px 3px 0 #000;border-color:#000;color:var(--ink)}
.lk.un{background:var(--g)}
body.locked button[onclick^="qty"],body.locked button[onclick^="toggle"],body.locked button[onclick^="del"],body.locked button[onclick^="b"],body.locked button[onclick^="importDB"],body.locked button[onclick^="restore"],body.locked button[onclick^="saveForm"],body.locked button[onclick*="'add'"],body.locked button[onclick*="edit/"]{opacity:.45;filter:grayscale(1);position:relative}
body.locked button[onclick^="toggle"]::after,body.locked button[onclick^="del"]::after,body.locked button[onclick^="b"]::after,body.locked button[onclick^="saveForm"]::after,body.locked button[onclick*="edit/"]::after,body.locked button[onclick^="importDB"]::after{content:"🔒";font-size:12px;margin-left:4px}
.lockmask{position:fixed;inset:0;background:rgba(27,27,47,.8);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px}
.lockbox{background:var(--bg);border:4px solid var(--ink);box-shadow:8px 8px 0 #000;padding:20px;width:100%;max-width:360px;text-align:center}
.lockbox h2{margin:0 0 6px;font-size:22px}.lockbox p{margin:0 0 14px;font-size:14px;color:#555}
.lockbox input{width:100%;font:inherit;font-size:20px;padding:12px;border:4px solid var(--ink);margin-bottom:14px;text-align:center}
.lockbox .go{width:100%;background:var(--g);font-size:22px;min-height:60px}
.lockbox .x{margin-top:12px;background:#fff;font-size:15px;min-height:40px;width:100%}
.lockbox .err{color:var(--r);min-height:20px;font-size:15px;margin-bottom:6px}
@keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.shake{animation:shk .4s steps(4)}
/* fridge */
.scene{display:flex;gap:14px;justify-content:center;align-items:flex-end;margin:6px 0 4px}
.fridge{width:200px;background:#dfe9f2;padding:6px;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);position:relative}
.door{position:relative;display:block;width:100%;background:#f4f8fb;border:4px solid var(--ink);box-shadow:inset -8px -8px 0 #c6d4e0,inset 6px 6px 0 #fff;text-align:left;padding:12px 10px;transform-origin:left center;transition:transform .45s steps(6);margin:0}
.door:active{transform:none;box-shadow:inset -8px -8px 0 #c6d4e0}
.door.open{transform:perspective(500px) rotateY(-75deg)}
.door .lbl{font-size:20px;display:block}.door .n{font-size:14px;color:#556}
.door .handle{position:absolute;right:12px;top:50%;width:10px;height:40px;margin-top:-20px;background:var(--gr);border:3px solid var(--ink)}
.d-frz{height:120px;margin-bottom:6px}.d-frz .lbl{color:var(--blue)}
.d-cold{height:200px}.d-cold .lbl{color:#178a5a}
.feet{display:flex;justify-content:space-between;padding:0 14px}.feet i{width:20px;height:10px;background:var(--ink)}
.shelf{width:130px;background:#c98b4a;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:8px;text-align:center;box-shadow:inset 0 -6px 0 #9a6430,6px 6px 0 var(--ink)}
.shelf .lbl{font-size:20px;color:#fff;text-shadow:2px 2px 0 var(--ink)}
.shelf .n{font-size:14px;color:#fff3}
.shelf .rows i{display:block;height:8px;background:#7a4a20;margin:30px 0 0}
.shelf .n{color:#fff}
.dot{display:inline-block;min-width:22px;padding:0 4px;text-align:center;background:var(--r);color:#fff;font-size:13px;border:2px solid var(--ink);margin-left:4px}
.hint{text-align:center;color:#667;font-size:14px;margin:14px 0 0}
/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tabs button{padding:8px 2px;font-size:17px}
.tabs .on{background:var(--ink);color:#fff}
.sec{font-size:16px;margin:16px 0 8px;padding:4px 10px;background:var(--ink);color:#fff;display:inline-block}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:6px}
.chips button{flex:none;padding:4px 10px;min-height:38px;font-size:15px;box-shadow:3px 3px 0 var(--ink);border-width:3px}
.chips .on{background:var(--y)}
.row{display:flex;align-items:center;gap:10px;background:#fff;padding:8px;margin-bottom:10px;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.row.out{opacity:.55;background:#eee}
.row .ico{width:48px;height:48px;flex:none;border:3px solid var(--ink);background:#fff}
.row .mid{flex:1;min-width:0}
.row .nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12px;color:#556;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-block;font-size:12px;padding:1px 6px;border:2px solid var(--ink);margin-top:3px}
.s-ok{background:#b8f0b8}.s-soon{background:var(--y)}.s-past{background:var(--o)}.s-bad{background:var(--r);color:#fff}.s-out{background:#bbb}.s-low{background:#ffe7c2}
.tag{display:inline-block;font-size:11px;padding:0 4px;margin:3px 0 0 3px;border:2px solid var(--r);color:var(--r);background:#fff}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:44px;height:44px;min-height:44px;padding:0;font-size:24px;line-height:1;box-shadow:3px 3px 0 var(--ink);border-width:3px}
.step .q{min-width:34px;text-align:center;font-size:18px;cursor:pointer;border-bottom:3px dashed var(--ink);padding:2px 2px 0}
.numbox input{font-size:34px!important;font-weight:700}.numbox .u2{font-size:16px;margin:-8px 0 12px;color:#556}.numbox .two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.numbox .two2 button{min-height:60px;font-size:20px}
.bk{width:44px;height:44px;flex:none;border:4px solid var(--ink);background:#fff;font-size:28px;line-height:36px;text-align:center;font-weight:700}.bk.on{background:var(--y)}.row.sel{background:#fff6c0}
.btop{display:flex;gap:8px;margin:0 0 12px}.btop button{flex:1;min-height:52px;font-size:18px}.btop .on{background:var(--y)}
.bbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:var(--ink);color:var(--y);padding:8px;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.bbar .cnt{grid-column:1/-1;text-align:center;font-size:18px;padding:2px 0}.bbar button{min-height:54px;padding:0 2px;font-size:16px}.bbar button:disabled{opacity:.4}
.toast .ud{margin-left:12px;background:var(--y);color:var(--ink);min-height:36px;font-size:16px;padding:4px 10px;border:3px solid var(--y)}
@media(min-width:900px){.bbar{max-width:560px}}
.step .u{display:block;font-size:10px;color:#667;font-weight:400}
/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--ink);padding:8px;gap:8px;z-index:5}

nav button span{font-size:22px}
nav .on{background:var(--y)}
nav .big{background:var(--g)}
/* detail */
.card{background:#fff;padding:14px;margin-bottom:14px}
.hero{display:flex;gap:14px;align-items:center}
.hero canvas{width:96px;height:96px;border:4px solid var(--ink);flex:none}
.hero h2{margin:0;font-size:22px}.hero .o{font-size:13px;color:#667;font-weight:400;margin-top:4px}
.big-st{font-size:20px;padding:10px;text-align:center;margin:14px 0 0}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:8px 8px;font-size:15px;margin-top:12px}.kv div:nth-child(odd){color:#667}
.kv div:nth-child(even){font-weight:400}

summary{font-size:15px;cursor:pointer}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.primary{background:var(--g);width:100%;font-size:19px}
.danger{background:#ffd6d6}
.note{font-size:12px;color:#778;font-weight:400;margin-top:10px}
/* form */
label{display:block;font-size:15px;margin:10px 0 4px}
input,select,textarea{font:inherit;font-size:17px;width:100%;padding:10px;border:4px solid var(--ink);background:#fff;font-weight:400;border-radius:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:16px;margin:12px 0}.check input{width:24px;height:24px}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:var(--ink);color:var(--y);padding:12px 18px;z-index:9;border:4px solid var(--y);font-size:16px}
.empty{text-align:center;color:#667;padding:24px;font-size:16px}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.3}}
@media(min-width:900px){#app{max-width:560px}nav{max-width:560px}}

// ---------- shelf life ----------
function days(a,b){return Math.round((b-a)/864e5)}
function life(it){
 if(it.qty<=0)return{k:'out',t:'用完了',c:'s-out',left:null};
 const r=DB.rules[it.rule]||{u:[30,60],o:[7,14]},[bb,mx]=it.opened?r.o:r.u;
 const d0=new Date(it.intake+'T00:00:00'),age=days(d0,TODAY),lb=bb-age,lm=mx-age;
 const soon=Math.min(14,Math.max(2,Math.round(bb*.2)));
 if(lm<0)return{k:'bad',t:'可能过期',c:'s-bad',left:lm,lb,lm,bb,mx,age};
 if(lb<0)return{k:'past',t:'过了最佳赏味期',c:'s-past',left:lm,lb,lm,bb,mx,age};
 if(lb<=soon)return{k:'soon',t:'尽快吃',c:'s-soon',left:lb,lb,lm,bb,mx,age};
 return{k:'ok',t:'新鲜',c:'s-ok',left:lb,lb,lm,bb,mx,age};
}
function stLabel(L,it){if(L.k==='out')return'用完了';
 const d=L.k==='ok'||L.k==='soon'?L.lb:L.lm;
 const tx=d>=60?Math.round(d/30)+'个月':d+'天';
 if(L.k==='bad')return'可能过期 · 超'+(-L.lm)+'天';
 if(L.k==='past')return'过赏味期 · 最多还'+tx;
 return L.t+' · 还'+tx+(it.low?' · 快用完':'')}

const ICACHE={};
function icon(it,size){const key=it.sprite+it.c1+it.c2+size;if(ICACHE[key])return ICACHE[key];
 const s=(SP[it.sprite]||SP.box).padEnd(144,'.'),c=document.createElement('canvas'),n=12,pad=2,px=Math.floor(size/(n+pad*2));
 c.width=c.height=size;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,size,size);
 const off=Math.floor((size-px*n)/2),pal={k:'#1b1b2f',a:it.c1||'#999',b:it.c2||'#555',w:'#ffffff'};
 for(let i=0;i<144;i++){const ch=s[i];if(ch==='.')continue;g.fillStyle=pal[ch];g.fillRect(off+(i%n)*px,off+Math.floor(i/n)*px,px,px)}
 return ICACHE[key]=c.toDataURL()}

 Object.assign(it,{name:v('name'),zone:v('zone'),kind:v('kind'),group:v('group'),qty:Math.max(0,+v('qty')||0),unit:v('unit')||'个',intake:v('date')||new Date().toISOString().slice(0,10),opened:document.getElementById('f-open').checked,orig:v('orig')||v('name'),style:v('style'),taste:v('taste')});
 if(isNew||grpChanged||!it.rule){it.rule=it.kind==='调料'?(it.zone==='冷藏'?'sauce':'blend'):((AUTO[it.zone]||{})[it.group]||'deli');}
 if(isNew||grpChanged){const s=SPR[it.group]||['box','#999','#555'];[it.sprite,it.c1,it.c2]=s}
 bump();toast('💾 已保存');go('item/'+it.id)};
function render(){const h=decodeURIComponent(location.hash.slice(1)),[v,a]=h.split('/');let out;
 if(v==='zone')out=vZone(a);else if(v==='item')out=vItem(a);else if(v==='shop')out=vShop();else if(v==='intake')out=vIntake();else if(v==='add')out=vForm();else if(v==='edit')out=vForm(a);else if(v==='alert')out=vAlert(a);else out=vHome();
 $('#app').innerHTML=out;if(v!=='zone'||!render.keep)window.scrollTo(0,0)}
/* ===== QTY+BATCH v1 ===== */
function fmtQ(n){return +(+n).toFixed(2)}
function parseQ(t){t=String(t).trim().replace(',','.').replace('，','.');if(!/^\d*\.?\d+$|^\d+\.$/.test(t))return null;return Math.max(0,fmtQ(parseFloat(t)))}
window.parseQ=parseQ;
function setQ(it,n){const was=it.qty;it.qty=Math.max(0,fmtQ(n));if(it.qty>0&&was<=0)it.low=false}
function numDlg(title,unit,val,cb){if(document.querySelector('.lockmask'))return;const m=document.createElement('div');m.className='lockmask';
 m.innerHTML=`<div class="lockbox numbox px"><h2>${esc(title)}</h2><div class="err" id="nerr"></div><input id="nin" type="text" inputmode="decimal" autocomplete="off" value="${val}"><div class="u2">${esc(unit||'')}</div><div class="two2"><button class="x" id="nx" style="margin:0;min-height:60px">取消</button><button class="go" id="ngo">确定</button></div></div>`;
 document.body.appendChild(m);const inp=m.querySelector('#nin');setTimeout(()=>{inp.focus();inp.select()},50);
 const ok=()=>{const n=parseQ(inp.value);if(n===null){m.querySelector('#nerr').textContent='❌ 请输入数字，比如 2 或 0.5';inp.select();return}m.remove();cb(n)};
 m.querySelector('#ngo').onclick=ok;inp.onkeydown=e=>{if(e.key==='Enter')ok();if(e.key==='Escape')m.remove()};m.querySelector('#nx').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()}}
window.numEdit=id=>{const it=byId(id);numDlg('✏️ '+it.name,it.unit,it.qty,n=>setQty(id,n))};
window.setQty=(id,n)=>{const it=byId(id);setQ(it,n);bump();toast(it.name+' → '+(it.qty<=0?'用完了':it.qty+' '+it.unit));render()};
let UNDO=null;
function toastU(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;const b=document.createElement('button');b.className='ud';b.textContent='↩ 撤销';b.onclick=()=>{d.remove();undo()};d.appendChild(b);document.body.appendChild(d);setTimeout(()=>d.remove(),6000)}
window.undo=()=>{if(!UNDO)return;DB.items=JSON.parse(UNDO);UNDO=null;bump();toast('↩ 已撤销');render()};
function snap(){UNDO=JSON.stringify(DB.items)}
window.batchT=()=>{state.batch=!state.batch;state.sel.clear();render.keep=1;render();render.keep=0};
window.selT=id=>{state.sel.has(id)?state.sel.delete(id):state.sel.add(id);render.keep=1;render();render.keep=0};
window.selAll=z=>{const ids=DB.items.filter(i=>i.zone===z).map(i=>i.id);if(ids.every(i=>state.sel.has(i)))state.sel.clear();else ids.forEach(i=>state.sel.add(i));render.keep=1;render();render.keep=0};
function selItems(){return DB.items.filter(i=>state.sel.has(i.id))}
window.bOp=(op,v)=>{const L=selItems();if(!L.length)return;
 if(op==='del'&&!confirm('确定删除这 '+L.length+' 样？\n'+L.map(i=>'· '+i.name).join('\n')))return;
 snap();if(op==='add')L.forEach(it=>setQ(it,it.qty+v));else if(op==='set')L.forEach(it=>setQ(it,v));else if(op==='out')L.forEach(it=>setQ(it,0));else if(op==='del'){DB.items=DB.items.filter(i=>!state.sel.has(i.id));state.sel.clear()}
 bump();render.keep=1;render();render.keep=0;toastU(op==='add'?L.length+' 样 '+(v>0?'+':'')+v:op==='set'?L.length+' 样 → '+v:op==='out'?L.length+' 样已用完':'🗑️ 已删 '+L.length+' 样')};
window.bSet=()=>{const n=state.sel.size;if(!n)return;numDlg('设为… （'+n+' 样）','',1,v=>bOp('set',v))};
window.shopT=id=>{state.ssel.has(id)?state.ssel.delete(id):state.ssel.add(id);render.keep=1;render();render.keep=0};
window.shopAll=()=>{const L=DB.items.filter(i=>i.qty<=0||i.low).map(i=>i.id);if(L.every(i=>state.ssel.has(i)))state.ssel.clear();else L.forEach(i=>state.ssel.add(i));render.keep=1;render();render.keep=0};
window.buyMany=()=>{const L=DB.items.filter(i=>state.ssel.has(i.id));if(!L.length)return;snap();const d=new Date().toISOString().slice(0,10);L.forEach(it=>{it.qty=Math.max(1,it.qty);it.low=false;it.intake=d;it.opened=false});state.ssel.clear();bump();render();toastU('✅ '+L.length+' 样已入库')};
window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#zone')){state.batch=false;state.sel.clear()}state.ssel.clear()});
/* ===== EDIT-LOCK v1 ===== */
const LOCK={"salt": "dae67781fa141f02e7dd9379efe8f630", "iter": 100000, "hash": "bebc943996294b6e15c5391027eed3b2bfbe02ae8fb8fe63810b19577e996050"},LKS='shenchu-unlocked';
function unlocked(){return sessionStorage.getItem(LKS)===LOCK.hash}
function LOCKBTN(){return unlocked()?`<button class="lk un" onclick="relock()">🔓 上锁</button>`:`<button class="lk" onclick="askUnlock()" aria-label="解锁编辑">🔒</button>`}
function hx(b){return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function checkPw(pw){const salt=new Uint8Array(LOCK.salt.match(/../g).map(h=>parseInt(h,16)));
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:LOCK.iter},k,256);return hx(b)===LOCK.hash}
window.checkPw=checkPw;
let pending=null;
window.askUnlock=(after)=>{pending=typeof after==='function'?after:null;if(document.querySelector('.lockmask'))return;
 const m=document.createElement('div');m.className='lockmask';m.innerHTML=`<div class="lockbox px"><h2>🔒 输入密码</h2><p>密码对了才能修改库存</p><div class="err" id="lkerr"></div><input id="lkpw" type="password" autocomplete="current-password" placeholder="密码"><button class="go" id="lkgo">解锁</button><button class="x" id="lkx">取消</button></div>`;
 document.body.appendChild(m);const inp=m.querySelector('#lkpw');setTimeout(()=>inp.focus(),50);
 const close=()=>{m.remove();if(location.hash==='#unlock')history.replaceState(null,'',location.pathname)};
 const tryIt=async()=>{if(!inp.value)return;if(await checkPw(inp.value)){sessionStorage.setItem(LKS,LOCK.hash);close();applyLock();toast('🔓 已解锁');const f=pending;pending=null;if(f)f();else render()}
  else{const b=m.querySelector('.lockbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');m.querySelector('#lkerr').textContent='❌ 密码不对';inp.value='';inp.focus()}};
 m.querySelector('#lkgo').onclick=tryIt;inp.onkeydown=e=>{if(e.key==='Enter')tryIt()};m.querySelector('#lkx').onclick=()=>{pending=null;close()}};
window.relock=()=>{sessionStorage.removeItem(LKS);applyLock();toast('🔒 已上锁');render()};
function applyLock(){document.body.classList.toggle('locked',!unlocked())}
['qty','toggle','del','bought','importDB','restore','saveForm','numEdit','setQty','batchT','bOp','bSet','buyMany','undo'].forEach(n=>{const f=window[n];window[n]=(...a)=>{if(unlocked())return f(...a);askUnlock(()=>f(...a))}});
const _render=render;render=function(){const h=decodeURIComponent(location.hash.slice(1)),v=h.split('/')[0];
 if(h==='unlock'){if(!unlocked()){location.hash.length;history.replaceState(null,'','#');_render();applyLock();askUnlock();return}history.replaceState(null,'','#')}
 if((v==='add'||v==='edit')&&!unlocked()){const t=h;history.replaceState(null,'','#');_render();applyLock();askUnlock(()=>go(t));return}
 _render();applyLock()};
(function(){const q=new URLSearchParams(location.search);if(q.get('t')==='batch'){state.batch=true;(q.get('sel')||'').split(',').filter(Boolean).forEach(i=>state.sel.add(i))}
 if(q.get('t')==='shop'){(q.get('sel')||'').split(',').filter(Boolean).forEach(i=>state.ssel.add(i))}
 if(q.get('t')==='num')setTimeout(()=>{const it=byId(q.get('id'));numDlg('✏️ '+it.name,it.unit,it.qty,()=>{})},100)})();
render();
</script></body></html>
