<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>1b的奇妙人生</title>
<style>
/* ==========================================================================
   1.1 全局重置（原样内置，一字不改）
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-block:100px}
body{
  background:#F2F4F7;color:#1D1D1F;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{
  appearance:none;-webkit-appearance:none;
  border:none;background:none;font:inherit;color:inherit;
  outline:none;border-radius:0;margin:0;
}
button{cursor:pointer;white-space:nowrap;flex-shrink:0;touch-action:manipulation;line-height:1}
button:disabled{opacity:.3;cursor:default}
button:focus-visible{outline:2px solid rgba(0,122,255,.45);outline-offset:2px}
input::placeholder{color:#A1A1A6}
input[type=search]::-webkit-search-decoration,
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
[hidden]{display:none!important}
ol,ul{list-style:none}
svg{display:block}

/* ==========================================================================
   1.2 设计变量（:root）
   ========================================================================== */
:root{
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --bg:#F2F4F7;
  --card:rgba(255,255,255,.78);
  --card-border:rgba(255,255,255,.88);
  --card-shadow:0 8px 28px -6px rgba(15,23,42,.06),inset 0 1px 0 rgba(255,255,255,.95);
  --well:rgba(118,118,128,.09);
  --line:rgba(15,23,42,.06);
  --text:#1D1D1F;
  --muted:#6E6E73;
  --faint:#A1A1A6;
  --blue:#007AFF;   --blue-soft:rgba(0,122,255,.10);
  --green:#10B981;  --green-soft:rgba(16,185,129,.12);
  --amber:#F59E0B;  --amber-soft:rgba(245,158,11,.14);
  --red:#EF4444;    --red-soft:rgba(239,68,68,.10);
  --r-card:22px; --r-well:14px; --r-pill:999px;
  --blur:blur(28px) saturate(190%);
}

/* ==========================================================================
   动画关键帧
   ========================================================================== */
@keyframes syncPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.88); }
}

@keyframes flashNew {
  0% { background-color: var(--green-soft); }
  100% { background-color: transparent; }
}

/* ==========================================================================
   1.3 防挤压铁律与基础共性归类
   ========================================================================== */
/* 两端行容器 */
.log-row,
.stock-row,
.meal-head,
.recipe-line,
.trend-head,
.date-bar,
.card-head,
.input-row,
.preview-line,
.stock-edit-bar,
.stock-add-bar,
.spice-toolbar,
.app-header,
.formula-head,
.sheet-head,
.sync-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

/* 胶囊组容器 */
.combo-row,
.filter-row,
.pot-row,
.recipe-tags,
.ing-chips,
.preview-actions,
.header-actions,
.stock-actions,
.stock-edit-actions,
.stock-add-actions {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  flex-wrap: wrap;
}

/* 竖排块容器 */
.hero-col,
.trend-body,
.recipe-body,
.sheet-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* 所有胶囊和按钮不换行、不收缩 */
.btn,
.pill,
.seg-btn,
.step-btn,
.status-pill,
.stock-act-btn,
.stock-add-btn,
.spice-del-x,
.combo-chip,
.tag,
.ing-chip,
.badge-soon,
.recipe-status,
.toast-btn,
.dock-btn,
.icon-btn,
.date-nav {
  white-space: nowrap;
  flex-shrink: 0;
}

/* 所有可变长的名字单行省略 */
.log-name,
.stock-name-text,
.recipe-name,
.preview-name,
.spice-name,
.spice-toolbar-hint,
.app-title {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* 唯一允许换行的文字 */
.step-text,
.formula-v {
  white-space: normal;
  line-height: 1.6;
}

/* ==========================================================================
   3.1 全局与布局
   ========================================================================== */
.app,
.app-shell {
  max-width: 430px;
  margin: 0 auto;
  padding: 16px 16px 104px;
}

.app-header,
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  padding: 4px 4px 0;
}

.app-title,
.topbar-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.header-actions,
.topbar-right {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 12px;
  flex-wrap: nowrap;
  flex-shrink: 0;
}

.sync-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--faint);
  flex-shrink: 0;
}

.sync-dot.is-ok,
.sync-dot.ok {
  background: var(--green);
}

.sync-dot.is-busy,
.sync-dot.is-warn,
.sync-dot.warn {
  background: var(--amber);
  animation: syncPulse 1.2s ease-in-out infinite;
}

.sync-dot.is-off,
.sync-dot.is-err,
.sync-dot.out {
  background: var(--faint);
}

.icon-btn,
.sync-btn {
  width: 36px;
  height: 36px;
  min-width: 36px;
  min-height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--well);
  font-size: 17px;
  color: var(--text);
  transition: transform 0.12s, background-color 0.15s;
}

.icon-btn:active,
.sync-btn:active {
  transform: scale(0.94);
}

.view {
  display: none;
}

.view.is-active {
  display: block;
}

.bottom-dock,
.tabbar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(398px, calc(100vw - 32px));
  height: 60px;
  background: var(--card);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--card-border);
  box-shadow: var(--card-shadow);
  border-radius: var(--r-pill);
  padding: 6px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  z-index: 20;
}

.dock-btn,
.tab-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  min-height: 30px;
  font-size: 15px;
  font-weight: 600;
  color: var(--muted);
  border-radius: var(--r-pill);
  transition: background-color 0.18s, color 0.18s, transform 0.12s;
}

.dock-btn:active,
.tab-btn:active {
  transform: scale(0.97);
}

.dock-btn.is-active,
.tab-btn.is-active {
  color: var(--blue);
  background: var(--blue-soft);
}

.tab-ico {
  font-size: 16px;
  line-height: 1;
}

.tab-lbl {
  font-size: 15px;
  font-weight: 600;
}

.glass-card,
.card {
  background: var(--card);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--card-border);
  box-shadow: var(--card-shadow);
  border-radius: var(--r-card);
  padding: 20px;
  margin-bottom: 16px;
}

.card-head {
  margin-bottom: 12px;
}

.card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

.card-meta {
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
}

.glass-well,
.well {
  background: var(--well);
  border-radius: var(--r-well);
  padding: 10px 14px;
}

.divider {
  height: 1px;
  background: var(--line);
  margin: 12px 0;
  border: none;
}

.field {
  width: 100%;
  font-size: 16px;
  line-height: 1.3;
  min-width: 0;
  color: var(--text);
}

.empty,
.empty-hint {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  padding: 12px 0;
}

.text-danger {
  color: var(--red) !important;
}

.text-ok {
  color: var(--green) !important;
}

/* ==========================================================================
   3.2 按钮、胶囊、分段、微调
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 40px;
  padding: 0 18px;
  border-radius: var(--r-pill);
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
  transition: transform 0.12s, opacity 0.12s;
}

.btn:active {
  transform: scale(0.96);
}

.btn-primary {
  background: var(--blue);
  color: #FFFFFF;
}

.btn-ok {
  background: var(--green);
  color: #FFFFFF;
  min-width: 64px;
}

.btn-ghost {
  background: var(--well);
  color: var(--text);
}

.btn-danger {
  background: var(--red-soft);
  color: #B91C1C;
}

.btn-sm {
  min-height: 32px;
  padding: 0 14px;
  font-size: 14px;
}

.btn-lg {
  min-height: 48px;
  padding: 0 28px;
  font-size: 16px;
}

.btn-block {
  width: 100%;
}

.pill-row {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  flex-wrap: wrap;
}

.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  padding: 0 14px;
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid var(--line);
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  transition: background-color 0.15s, color 0.15s, border-color 0.15s, transform 0.12s;
}

.pill:active {
  transform: scale(0.96);
}

.pill.is-active {
  background: var(--blue);
  color: #FFFFFF;
  border-color: transparent;
}

.pill-sm {
  min-height: 30px;
  padding: 0 12px;
  font-size: 13px;
}

.pill-count {
  margin-left: 6px;
  font-size: 13px;
  color: var(--muted);
}

.pill.is-active .pill-count {
  color: rgba(255, 255, 255, 0.8);
}

.seg {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  gap: 4px;
  flex-wrap: nowrap;
  background: var(--well);
  border-radius: 12px;
  padding: 3px;
}

.seg-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 32px;
  padding: 0 12px;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  transition: background-color 0.15s, color 0.15s, box-shadow 0.15s;
}

.seg-btn.is-active {
  background: #FFFFFF;
  color: var(--text);
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
}

.seg.seg-sm {
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--card-border);
  border-radius: 10px;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
}

.seg.seg-sm .seg-btn {
  min-width: 36px;
  min-height: 26px;
  padding: 0 8px;
  border-radius: 7px;
  font-size: 12px;
}

.meal-input-head,
.weight-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.meal-input-head {
  margin-bottom: 12px;
}

.weight-controls {
  justify-content: flex-start;
}

#cook-seg {
  margin-left: auto;
}

.stepper,
.preview-Ctrl {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.step-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 30px;
  min-height: 30px;
  padding: 0 10px;
  border-radius: var(--r-pill);
  background: rgba(255, 255, 255, 0.85);
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
  color: var(--blue);
  transition: transform 0.12s, background-color 0.12s;
}

.step-btn:active {
  transform: scale(0.94);
}

.step-val,
.preview-g {
  min-width: 52px;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  flex-shrink: 0;
}

.tag {
  height: 24px;
  padding: 0 10px;
  border-radius: 8px;
  background: var(--well);
  font-size: 13px;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
}

/* ==========================================================================
   3.3 Tab 1：今天
   ========================================================================== */
.date-bar {
  margin-bottom: 12px;
  padding: 0 4px;
}

.date-nav {
  width: 36px;
  height: 36px;
  min-width: 36px;
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  color: var(--blue);
  border-radius: 50%;
  transition: background-color 0.15s, transform 0.12s;
}

.date-nav:active {
  background: var(--blue-soft);
  transform: scale(0.94);
}

.date-center {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 0;
}

.date-label,
.date-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}

.hero-card {
  background: var(--card);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--card-border);
  box-shadow: var(--card-shadow);
  border-radius: var(--r-card);
  padding: 20px;
  margin-bottom: 16px;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.hero-col,
.hero-cell {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.hero-label,
.hero-lbl {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.hero-value {
  display: flex;
  align-items: baseline;
}

.hero-num {
  font-size: 32px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}

.hero-unit {
  font-size: 15px;
  font-weight: 500;
  color: var(--muted);
  margin-left: 4px;
}

.progress,
.hero-bar {
  height: 6px;
  border-radius: 3px;
  background: var(--well);
  overflow: hidden;
}

.progress-fill,
.hero-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--blue);
  transition: width 0.35s ease;
}

.progress-fill.is-over,
.hero-bar-fill.is-over,
.hero-bar-fill.is-alert {
  background: var(--red);
}

.progress-fill.is-ok,
.hero-bar-fill.is-ok,
.hero-bar-fill.ok {
  background: var(--green);
}

.hero-foot {
  font-size: 13px;
  color: var(--muted);
}

.hero-sub,
.macro-row {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}

.macro-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.macro-val {
  font-weight: 600;
  color: var(--text);
}

.input-card,
.parse-box {
  background: var(--card);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--card-border);
  box-shadow: var(--card-shadow);
  border-radius: var(--r-card);
  padding: 20px;
  margin-bottom: 16px;
}

#meal-seg {
  margin-bottom: 0;
}

.input-row,
.parse-input-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 12px;
}

.input-well {
  flex: 1;
  min-width: 0;
}

.parse-input {
  width: 100%;
  font-size: 16px;
  line-height: 1.3;
  min-width: 0;
}

.preview-box,
.parse-preview {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 16px;
  background: var(--blue-soft);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.preview-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.preview-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}

.preview-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.preview-name {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
}

.preview-nut,
.preview-total {
  font-size: 13px;
  color: var(--muted);
  flex-shrink: 0;
  white-space: nowrap;
}

.preview-del {
  width: 30px;
  height: 30px;
  min-width: 30px;
  min-height: 30px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  background: var(--well);
  color: var(--muted);
  font-size: 16px;
  flex-shrink: 0;
}

.preview-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.preview-actions {
  justify-content: flex-end;
}

.combo-row,
.freq-row {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.freq-lbl {
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
}

.combo-chip,
.combo-pill,
.freq-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 34px;
  padding: 0 14px;
  border-radius: var(--r-pill);
  background: var(--well);
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  flex-shrink: 0;
  transition: transform 0.12s, background-color 0.15s;
}

.combo-chip:active,
.combo-pill:active,
.freq-chip:active {
  transform: scale(0.96);
}

.combo-chip.is-warn,
.combo-pill.is-warn,
.combo-pill.is-alert,
.freq-chip.is-warn,
.combo-chip.warn {
  background: var(--amber-soft);
  color: #B45309;
}

.meal-list-card {
  background: var(--card);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--card-border);
  box-shadow: var(--card-shadow);
  border-radius: var(--r-card);
  padding: 8px 20px;
  margin-bottom: 16px;
}

.meal-group {
  margin-top: 8px;
}

.meal-group:first-child {
  margin-top: 0;
}

.meal-head {
  min-height: 44px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}

.meal-name,
.meal-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

.meal-kcal,
.meal-sum {
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
}

.log-list {
  display: flex;
  flex-direction: column;
}

.log-item {
  display: flex;
  flex-direction: column;
}

.log-row {
  min-height: 50px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}

.meal-group > .log-row:last-child,
.log-list > .log-item:last-child .log-row {
  border-bottom: none;
}

.log-row.is-new {
  animation: flashNew 1.2s ease-out forwards;
}

.log-main {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.log-name {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
}

.log-g {
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
  flex-shrink: 0;
}

.log-side,
.log-nut {
  display: flex;
  align-items: baseline;

  [/^(鸡胸肉?|鸡脯肉?|鸡胸脯肉)$/, [/^鸡胸肉$/, /^鸡胸/, /鸡脯/, /鸡.*胸/]],

  [/^(燕麦片?|麦片|燕麦米|速冲燕麦|快熟燕麦片?)$/, [/燕麦|麦片/]],
  [/^(意面|意大利面|意粉|通心粉|pasta|spaghetti)$/, [/意大利面|意面|pasta|spaghetti|通心粉|bavette|tortiglioni/]],
  [/^(牛肉|牛排|牛)$/, [/^牛肉$/, /^牛肉(?!馅)/, /牛(胸|里脊|腩|腱|排|臀|腿)/]],
  [/^(猪肉|猪排?|猪)$/, [/^猪肉$/, /^猪肉(?!馅)/, /猪(里脊|颈|腿|排|五花|梅花)/, /猪(?!油|蹄|肝)/]],
  [/^(虾|虾仁|大虾|对虾|基围虾|鲜虾|白虾)$/, [/南美白对虾/, /对虾|大虾|基围虾/, /^虾仁$/, /虾/]]

const FOOD_ALIAS_EXCL = /(?<!乳)糖|蛋糕|巧克力|饼干|面包|挂面|方便|拉面|馅|混合|酸奶|奶酪|奶油|牛肚|牛肝|鸡肝|鸡翅|鸡块|饺|丸|肠/;

  return hit ? {res: hit[1], excl: hit[2]} : null;
}

function foodMatch(q, min = 30){
  const n = fnorm(uiName(q)).toLowerCase();
  if (!n) return null;
  const pct = (String(q).match(/(\d+(?:[.,]\d+)?)\s*[%％]/) || [])[1];
  const al = foodAliasOf(n);
  const cands = [];
  for (const f of foods()) {
    if (!f.nut || !(Number(f.nut.kcal) >= 0)) continue;
    const nm = uiName(f.name), fn = fnorm(nm).toLowerCase();
    if (!fn) continue;
    let s = 0, viaAlias = false;
    if (fn === n) s = 100;
    else if (fn.startsWith(n) || (n.startsWith(fn) && fn.length >= 2)) s = 70;
    else if (n.length >= 2 && fn.includes(n)) s = 50;
    else if (n.length >= 2 && f.hay.includes(n)) s = 30;
    if (al && !FOOD_ALIAS_EXCL.test(fn) && !(al.excl && al.excl.test(fn))) {

    const blocked = !c.exact && !c.viaAlias && cands.some(o => o !== c && o.exact);

// 连写切分：100鸡蛋35燕麦200牛奶 / 鸡蛋100燕麦35牛奶200。数量 = 数字(+g/ml/个/勺/包/斤/两/份)，百分比、营养速记、名字里的数字不算数量。
const QTY_UNIT = '(?:kg|g|ml)(?![A-Za-z])|千克|公斤|克|毫升|个|颗|只|枚|勺|包(?![子菜])|斤|两|份';
// 整段读取中文数量；不支持的写法也要保留，不能从中间截取一个较小的数字。
const CN_QTY_CHARS = '零〇一二两三四五六七八九十百千万亿半点几多余又分之';
const QTY_RE = '(?<![№#.\\d' + CN_QTY_CHARS + '])' +
  '(?:(\\d+(?:\\.\\d+)?)(?![.\\d%％])(?:(?=\\s*(?:' + QTY_UNIT + '))|(?![' + CN_QTY_CHARS + ']))' +
  '|([' + CN_QTY_CHARS + '\\d]+)(?=\\s*(?:' + QTY_UNIT + ')))\\s*(' + QTY_UNIT + ')?';
const MACRO_RE = /(\d+(?:\.\d+)?)\s*(kcal|千卡|大卡|卡|[pfc])(?=\s|$|\d)/gi;
const CN_NUM = {'半':0.5,'一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};
function chineseQty(s){
  if (CN_NUM[s] !== undefined) return CN_NUM[s];
  // 支持一至九十九及「半」；百、千、小数、约数等交给待确认流程。
  const m = s.match(/^([一二两三四五六七八九]?)十([一二三四五六七八九]?)$/);
  return m ? (m[1] ? CN_NUM[m[1]] : 1) * 10 + (m[2] ? CN_NUM[m[2]] : 0) : null;
}
function maskNameNumbers(s){
  // 等长遮罩只用于找数量，切分及名称仍取原文；0卡也不能当营养速记。
  return s.replace(/\d+(?:[.,]\d+)?\s*[%％]|(?<![\d.])0(?:\.0+)?\s*[脂糖卡]/g, m => '·'.repeat(m.length));
}
function qtyTokens(s){
  const re = new RegExp(QTY_RE, 'gi'), out = [], masked = maskNameNumbers(s);
  let m;
  while ((m = re.exec(masked))) {
    // 英文名称后的数量须带明确单位，B12、whey30 等名称内部数字不作克重。
    if (/[A-Za-z]/.test(s[m.index - 1] || '') && !m[3]) continue;
    const value = m[1] ?? m[2];
    out.push({s: m.index, e: m.index + m[0].length, n: /^\d+(?:\.\d+)?$/.test(value) ? +value : chineseQty(value), u: (m[3] || '').toLowerCase()});
  }
  return out;
}
function splitConnected(p){
  if (new RegExp(MACRO_RE.source, 'i').test(maskNameNumbers(p))) return [p];
  const ns = qtyTokens(p);
  if (ns.length < 2) return [p];
  // 数量与食物名交替成 token 序列：数字在前 → 数字绑后面的名字；名字在前 → 名字绑后面的数字
  const tk = [];
  let pos = 0;
  for (const q of ns) {
    if (p.slice(pos, q.s).trim()) tk.push({t: 'T', s: pos, e: q.s});
    tk.push({t: 'N', s: q.s, e: q.e});
    pos = q.e;
  }
  if (p.slice(pos).trim()) tk.push({t: 'T', s: pos, e: p.length});
  const out = [];
  for (let i = 0; i < tk.length;) {
    const a = tk[i], b = tk[i + 1];
    if (b && a.t !== b.t) { out.push(p.slice(a.s, b.e)); i += 2; }
    else { out.push(p.slice(a.s, a.e)); i++; }
  }

}
function splitInput(t){
  return String(t || '').split(/[，,、;；\n]+/).map(s => s.trim()).filter(Boolean).flatMap(splitConnected);
}
const GRAM_RE = /^(熟|生)?\s*(.+?)\s*(\d+(?:\.\d+)?)\s*(g|克|ml|毫升)?$/i;
const PROTEIN_RE = /蛋白粉|乳清|protein|whey/i;
// 数量换算成克；null = 这个单位对这种食物没有固定克重
function qtyGrams(n, u, name){
  if (!u || /^(g|克|ml|毫升)$/.test(u)) return n;
  if (/^(kg|千克|公斤)$/.test(u)) return n * 1000;
  if (u === '斤') return n * 500;
  if (u === '两') return n * 50;
  if (/^(个|颗|只|枚)$/.test(u)) return /蛋(?!白粉)/.test(name) ? n * 50 : null;
  if (u === '勺') return PROTEIN_RE.test(name) ? n * 15 : null;
  if (u === '份') return PROTEIN_RE.test(name) ? n * 30 : null;
  if (u === '包') return /燕麦|麦片/.test(name) ? n * 40 : null;
  return null;
}
function parseQty(seg){
  const q = qtyTokens(seg)[0];
  const name = (q ? seg.slice(0, q.s) + ' ' + seg.slice(q.e) : seg).replace(/\s+/g, ' ').trim();
  if (!q) return {name, grams: 100};
  if (q.n === null) return {name, grams: null};
  const grams = qtyGrams(q.n, q.u, name);
  return {name, grams: grams > 0 ? grams : null};
}
function parseLocal(text){
  const items = [], rest = [];
  const push = (it, seg) => { it.rawSeg = seg; items.push(it); };
  for (const seg of splitInput(text)) {
    // 快捷数字均为本次总量；克数只用于以后按比例增减。
    const explicit = {};
    const masked = maskNameNumbers(seg);
    const namePart = seg.replace(MACRO_RE, (match, n, unit, offset) => {
      if (masked.slice(offset, offset + match.length) !== match) return match;
      explicit[/^(kcal|千卡|大卡|卡)$/i.test(unit) ? 'kcal' : unit.toLowerCase()] = +n; return ' ';
    }).trim();
    if (Object.keys(explicit).length) {
      const gram = namePart.match(GRAM_RE);
      const name = (gram ? gram[2] : namePart).trim();
      if (!name) { rest.push(seg); continue; }
      const grams = gram && +gram[3] > 0 ? +gram[3] : 100;
      const p = explicit.p || 0, fat = explicit.f || 0, c = explicit.c || 0;
      const kcal = explicit.kcal ?? r0(p * 4 + fat * 9 + c * 4);
      push(mkPreview(name, grams, {kcal:kcal/grams,p:p/grams,f:fat/grams,c:c/grams,fb:0}, 'custom', 'raw'), seg);
      continue;
    }
    const q = parseQty(seg);
    if (!q.name) { rest.push(seg); continue; }
    const pre = q.name.match(/^(熟|生)(?!菜|抽|姜|粉|蚝|鱼)(.+)$/);
    const core = pre ? pre[2] : q.name;
    const grams = q.grams;
    const cooked = seg.includes('熟') || FIT.cookMode === 'cooked';
    const f = grams ? (foodMatch(q.name, 30) || (pre ? foodMatch(core, 30) : null)) : null;
    const nut = grams && !f ? getNut(q.name) : null;
    if (f) {
      push(foodToItem(f, grams, cooked), seg);
    } else if (nut && (nut.kcal > 0 || nut.p > 0 || nut.f > 0 || nut.c > 0)) {
      const per = {};
      ['kcal','p','f','c','fb'].forEach(k => { per[k] = (Number(nut[k]) || 0) / 100; });
      push(mkPreview((cooked ? '熟' : '') + q.name.replace(/^熟+/, ''), grams, per, 'custom', cooked ? 'cooked' : 'raw'), seg);
    } else {
      const it = mkPreview((cooked ? '熟' : '') + core.replace(/^熟+/, ''), grams || 100, {kcal:0,p:0,f:0,c:0,fb:0}, 'custom', cooked ? 'cooked' : 'raw');

function trendData(n){

  if (!W.length) return '▸';

}
function trendFoot(D){
  const H = D.filter(d => d.has);
  if (!H.length) return '—';
  return `日均 ${r0(H.reduce((s, d) => s + d.kcal, 0) / H.length)} kcal · 蛋白 ${r0(H.reduce((s, d) => s + d.p, 0) / H.length)}g`;
}
function svgKcal(D){
  const W = 340, H = 130, top = 16, bot = 20, ch = H - top - bot, bw = W / D.length;
  const max = Math.max(FIT.target * 1.25, ...D.map(d => d.kcal));
  const y = v => top + ch - (v / max) * ch, ty = y(FIT.target);
  let s = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img">`;
  D.forEach((d, i) => {
    if (!d.has) return;
    const h = Math.max(2, ch * d.kcal / max);
    s += `<rect class="chart-bar ${d.kcal > FIT.target ? 'is-over' : 'is-ok'}" x="${(i * bw + bw * 0.18).toFixed(1)}" y="${(top + ch - h).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${h.toFixed(1)}" rx="3"></rect>`;
  });
  s += `<line class="chart-target-line" x1="0" x2="${W}" y1="${ty.toFixed(1)}" y2="${ty.toFixed(1)}"></line>`;
  s += `<text class="chart-label" x="${W}" y="${(ty - 4).toFixed(1)}" text-anchor="end">${FIT.target}</text>`;
  s += `<text class="chart-label" x="0" y="${H - 4}">${shortDate(D[0].k)}</text>`;
  s += `<text class="chart-label" x="${W}" y="${H - 4}" text-anchor="end">${shortDate(D[D.length - 1].k)}</text>`;
  return s + '</svg>';
}
function svgWeight(D){
  const P = D.map((d, i) => ({i, kg: d.kg})).filter(p => p.kg != null);
  if (P.length < 2) return '<div class="empty">体重不足两天</div>';
  const W = 340, H = 110, top = 22, bot = 22, ch = H - top - bot, bw = W / D.length;
  const lo = Math.min(...P.map(p => p.kg)) - 0.3, hi = Math.max(...P.map(p => p.kg)) + 0.3;
  const x = i => i * bw + bw / 2, y = v => top + ch - ((v - lo) / (hi - lo)) * ch;
  const a = P[0], b = P[P.length - 1];
  let s = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img">`;
  s += `<polyline class="chart-line" points="${P.map(p => x(p.i).toFixed(1) + ',' + y(p.kg).toFixed(1)).join(' ')}"></polyline>`;
  [a, b].forEach((p, j) => {
    s += `<circle class="chart-dot" cx="${x(p.i).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="3.5"></circle>`;
    s += `<text class="chart-label" x="${x(p.i).toFixed(1)}" y="${(y(p.kg) - 9).toFixed(1)}" text-anchor="${j ? 'end' : 'start'}">${r1(p.kg)}</text>`;
  });
  return s + '</svg>';
}

    if (views[k]) views[k].classList.toggle('is-active', k === curTab);
  });

  document.querySelectorAll('.dock-btn[data-act="tab"]').forEach(btn => {
    btn.classList.toggle('is-active', btn.dataset.v === curTab);
  });

  renderToday();
  renderStock();
  renderCook();
  if (typeof updateSyncUI === 'function') updateSyncUI();
}

function renderToday() {
  const todayStr = dayKey(new Date());
  const isToday = CUR_DAY === todayStr;

  // 2.3.1 日期切换条 #date-bar
  const dateBar = document.getElementById('date-bar');
  if (dateBar) {
    const rawLbl = typeof dateLabel === 'function' ? dateLabel(CUR_DAY) : CUR_DAY;
    const lblText = isToday
      ? (rawLbl.indexOf('今天') === 0 ? rawLbl : '今天 · ' + rawLbl)
      : rawLbl;
    dateBar.innerHTML =
      `<button class="date-nav" data-act="day-prev" aria-label="前一天">‹</button>` +
      `<div class="date-center">` +
        `<span class="date-label">${esc(lblText)}</span>` +
        (isToday ? '' : `<button class="pill pill-sm" data-act="day-today">回今天</button>`) +
      `</div>` +
      `<button class="date-nav" data-act="day-next" aria-label="后一天"${isToday ? ' disabled' : ''}>›</button>`;
  }

  // 2.3.2 双大字看板 #hero
  const hero = document.getElementById('hero');
  if (hero) {
    const T = typeof dayTotals === 'function' ? dayTotals(CUR_DAY) : { kcal: 0, p: 0, f: 0, c: 0 };
    const tgtKcal = r0(FIT.target || 1800);
    const tgtProt = r0(FIT.prot || 140);
    const tgtFat = r0(FIT.fat || 55);
    const tgtCarb = r0(FIT.carb || 185);

    const eatKcal = r0(T.kcal || 0);
    const eatP = r0(T.p || 0);
    const eatF = r0(T.f || 0);
    const eatC = r0(T.c || 0);

    const overK = (T.kcal || 0) > tgtKcal;
    const kLabel = overK ? '已超标' : '还能吃';
    const kNum = overK ? r0((T.kcal || 0) - tgtKcal) : r0(tgtKcal - (T.kcal || 0));
    const kPct = tgtKcal > 0 ? Math.min(100, Math.max(0, r0(((T.kcal || 0) / tgtKcal) * 100))) : 0;

    const okP = (T.p || 0) >= tgtProt;
    const pLabel = okP ? '蛋白质' : '蛋白差';
    const pNum = okP ? eatP : r0(tgtProt - (T.p || 0));
    const pPct = tgtProt > 0 ? Math.min(100, Math.max(0, r0(((T.p || 0) / tgtProt) * 100))) : 0;

    const fHtml = eatF > tgtFat ? `<span class="text-danger">${eatF}</span>` : `${eatF}`;
    const cHtml = eatC > tgtCarb ? `<span class="text-danger">${eatC}</span>` : `${eatC}`;

    hero.innerHTML =
      `<div class="hero-grid">` +
        `<div class="hero-col">` +
          `<span class="hero-label">${kLabel}</span>` +
          `<div class="hero-value"><span class="hero-num ${overK ? 'text-danger' : ''}">${kNum}</span><span class="hero-unit">kcal</span></div>` +
          `<div class="progress"><div class="progress-fill ${overK ? 'is-over' : ''}" style="width:${kPct}%"></div></div>` +
          `<span class="hero-foot">已吃 ${eatKcal} / ${tgtKcal}</span>` +
        `</div>` +
        `<div class="hero-col">` +
          `<span class="hero-label">${pLabel}</span>` +
          `<div class="hero-value"><span class="hero-num ${okP ? 'text-ok' : ''}">${pNum}</span><span class="hero-unit">g</span></div>` +
          `<div class="progress"><div class="progress-fill ${okP ? 'is-ok' : ''}" style="width:${pPct}%"></div></div>` +
          `<span class="hero-foot">已吃 ${eatP} / ${tgtProt}g</span>` +
        `</div>` +
      `</div>` +
      `<div class="hero-macros">` + [['f','脂肪',T.f,tgtFat],['c','碳水',T.c,tgtCarb]].map(([k,label,value,target]) =>
        `<div class="hero-macro-item"><span class="hero-macro-label">${label} ${r1(value)} / ${target}g</span><div class="progress" role="progressbar" aria-label="${label}" aria-valuenow="${r1(value)}" aria-valuemin="0" aria-valuemax="${target}"><div class="progress-fill" data-progress="${k}" style="width:${Math.min(100, Math.max(0, value / target * 100))}%"></div></div></div>`
      ).join('') + `</div>`;
  }

  // 2.3.3 餐次分段 #meal-seg
  const mealOrder = [
    ['breakfast', '早'],
    ['lunch', '午'],
    ['dinner', '晚'],
    ['snack', '加']
  ];
  if (!UI.meal) UI.meal = typeof curMeal === 'function' ? curMeal() : 'breakfast';
  const mealSeg = document.getElementById('meal-seg');
  if (mealSeg) {
    mealSeg.innerHTML = mealOrder.map(([k, n]) =>
      `<button class="seg-btn ${UI.meal === k ? 'is-active' : ''}" data-act="meal" data-v="${k}">${n}</button>`
    ).join('');
  }
  const cookSeg = document.getElementById('cook-seg');
  if (cookSeg) cookSeg.innerHTML = modeButtons(FIT.cookMode, 'cook-mode');

  renderCustomFood();

  // 2.3.3 预览条 #parse-preview
  const previewBox = document.getElementById('parse-preview');
  if (previewBox) {
    const pv = Array.isArray(UI.preview) ? UI.preview : [];
    if (!pv.length) {
      previewBox.hidden = true;
      previewBox.innerHTML = '';
    } else {
      previewBox.hidden = false;
      const rowsHtml = pv.map((it, i) => {
        const hasG = Number(it.grams) > 0;
        const gVal = r0(it.grams || 0);
        const stepperHtml = hasG
          ? `<div class="stepper">` +
              `<button class="step-btn" data-act="pv-step" data-i="${i}" data-v="-10"${gVal <= 10 ? ' disabled' : ''}>-10g</button>` +
              `<span class="step-val">${gVal}g</span>` +
              `<button class="step-btn" data-act="pv-step" data-i="${i}" data-v="10">+10g</button>` +
            `</div>`
          : `<span></span>`;
        return (
          `<div class="preview-row">` +
            `<div class="preview-line">` +
              `<span class="preview-name">${esc(it.name || '')}${it.needsNutrition ? ' <span class="badge-soon" style="background:var(--amber-soft);color:#B45309;font-size:11px;padding:2px 6px;">待补营养</span>' : ''}</span>` +
              `<button class="preview-del" data-act="pv-del" data-i="${i}" aria-label="移除">×</button>` +
            `</div>` +
            `<div class="preview-line">` +
              `<div class="weight-controls">${stepperHtml}${itemModeSeg(it, 'pv-mode', `data-i="${i}"`)}</div>` +
              `<div class="preview-nut-group">` +
                `<span class="preview-nut">${r0(it.kcal || 0)} kcal · P ${r1(it.p || 0)}g</span>` +
                `<button class="btn btn-ghost btn-sm btn-pv-edit ${it.editMacros ? 'active is-active' : ''}" data-act="pv-macros" data-i="${i}" aria-expanded="${!!it.editMacros}">改营养</button>` +
              `</div>` +
            `</div>` +
            (it.editMacros ? `<div class="preview-macro-wrap">${macroEditor('pv-' + i, it.needsNutrition ? {} : it, '本次总营养（修改后点「记」直接生效）')}</div>` : '') +
          `</div>`
        );
      }).join('');
      previewBox.innerHTML =
        rowsHtml +
        `<div class="preview-actions">` +
          `<button class="btn btn-ghost btn-sm" data-act="pv-cancel">取消</button>` +
          `<button class="btn btn-ok" data-act="pv-commit">记</button>` +
        `</div>`;
    }
  }

  // 2.3.3 自定义入口 #combo-row
  const comboRow = document.getElementById('combo-row');
  if (comboRow) {
    comboRow.innerHTML =
      `<button class="combo-chip combo-pill-custom ${UI.customOpen ? 'active' : ''}" data-act="custom-toggle" aria-expanded="${UI.customOpen}" aria-controls="custom-food-box">+ 自定义</button>`;
  }

  // 2.3.4 今日饮食流水 #meal-list
  const mealList = document.getElementById('meal-list');
  if (mealList) {
    const entries = (FIT.log && FIT.log[CUR_DAY]) || [];
    if (!entries.length) {
      mealList.innerHTML = `<div class="empty">${isToday ? '今天还没记' : '这天还没记'}</div>`;
    } else {
      const groupsHtml = mealOrder.map(([mKey, mLabel]) => {
        const mEntries = entries.filter(e => (e.meal || 'breakfast') === mKey);
        if (!mEntries.length) return '';
        const mKcal = r0(mEntries.reduce((s, e) => s + (Number(e.kcal) || 0), 0));
        const rowsHtml = mEntries.map(e => {
          const isNew = _isFlashId(e.id);
          const dispName = typeof entryName === 'function' ? entryName(e) : (e.name || '');
          const hasG = Number(e.grams) > 0;
          const gVal = r0(e.grams || 0);
          const rowHtml =
            `<div class="log-row ${isNew ? 'is-new' : ''}" data-act="entry" data-id="${esc(e.id)}">` +
              `<div class="log-main">` +
                `<span class="log-name">${esc(dispName)}</span>` +
                (hasG ? `<span class="log-g">${e.mode === 'cooked' ? '熟' : ''}${gVal}g</span>` : '') +
              `</div>` +
              `<div class="log-side">` +
                `<span class="log-kcal">${r0(e.kcal || 0)}</span>` +
                `<span class="log-p">P${r0(e.p || 0)}g</span>` +
              `</div>` +
            `</div>`;

          if (UI.editEntry !== e.id) return rowHtml;

          const stepperHtml = hasG
            ? `<div class="stepper">` +
                `<button class="step-btn" data-act="e-step" data-id="${esc(e.id)}" data-v="-10"${gVal <= 10 ? ' disabled' : ''}>-10g</button>` +
                `<span class="step-val">${gVal}g</span>` +
                `<button class="step-btn" data-act="e-step" data-id="${esc(e.id)}" data-v="10">+10g</button>` +
              `</div>`
            : `<span></span>`;

          const mealBtns = mealOrder.map(([mk, mn]) =>
            `<button class="seg-btn ${(e.meal || 'breakfast') === mk ? 'is-active' : ''}" data-act="e-meal" data-id="${esc(e.id)}" data-v="${mk}">${mn}</button>`
          ).join('');

          const editBarHtml =
            `<div class="log-edit-bar">` +
              `<div class="weight-controls">${stepperHtml}${itemModeSeg(e, 'e-mode', `data-id="${esc(e.id)}"`)}</div>` +
              `<button class="btn btn-danger btn-sm" data-act="e-del" data-id="${esc(e.id)}">删</button>` +
              `<div class="seg seg-sm edit-meal-seg">${mealBtns}</div>` +
              `<div class="entry-macros">${macroEditor('entry-' + e.id, e, '本次份量的总营养')}</div>` +
              `<button class="btn btn-primary btn-sm entry-macro-save" data-act="entry-save-macros" data-id="${esc(e.id)}">保存营养</button>` +
            `</div>`;

          return rowHtml + editBarHtml;
        }).join('');

        return (
          `<div class="meal-group">` +
            `<div class="meal-head">` +
              `<span class="meal-name">${mLabel}</span>` +
              `<span class="meal-kcal">${mKcal} kcal</span>` +
            `</div>` +
            rowsHtml +
          `</div>`
        );
      }).join('');
      mealList.innerHTML = groupsHtml;
    }
    _clearFlashIds();
  }

  // 2.3.5 体重与活动 .body-card（静态输入框只改值，焦点保护）
  const wtInput = document.getElementById('wt-input');
  if (wtInput && document.activeElement !== wtInput) {
    const wtObj = FIT.wt && FIT.wt[CUR_DAY];
    wtInput.value = wtObj && Number(wtObj.kg) > 0 ? String(wtObj.kg) : '';
    wtInput.placeholder = _prevWeightPlaceholder(CUR_DAY);
  }
  const actInput = document.getElementById('act-input');
  if (actInput && document.activeElement !== actInput) {
    const actObj = FIT.act && FIT.act[CUR_DAY];
    actInput.value = actObj && Number(actObj.kcal) > 0 ? String(r0(actObj.kcal)) : '';
  }

  // 2.3.6 趋势折叠卡 #trend-card
  const trendCard = document.getElementById('trend-card');
  if (trendCard) {
    const isOpen = !!UI.trendOpen;
    trendCard.classList.toggle('is-open', isOpen);
    const days = UI.trendDays === 7 ? 7 : 14;
    const D = typeof trendData === 'function' ? trendData(days) : [];
    const list = Array.isArray(D) ? D : (D && (D.days || D.rows) ? (D.days || D.rows) : []);

    const wts = list.map(d => Number(d.wt ?? d.kg ?? 0)).filter(v => v > 0);
    const arrow = isOpen ? '▾' : '▸';
    let summaryText = arrow;
    if (wts.length >= 2) {
      summaryText = `${wts[0]} → ${wts[wts.length - 1]} kg · ${arrow}`;
    } else if (wts.length === 1) {
      summaryText = `${wts[0]} kg · ${arrow}`;
    }

    const headHtml =
      `<div class="trend-head" data-act="trend-toggle">` +
        `<span class="card-title">趋势</span>` +
        `<span class="trend-summary">${esc(summaryText)}</span>` +
      `</div>`;

    if (!isOpen) {
      trendCard.innerHTML = headHtml;
    } else {
      const loggedDays = list.filter(d => Number(d.kcal) > 0);
      let footText = '—';
      if (loggedDays.length > 0) {
        const avgK = r0(loggedDays.reduce((s, d) => s + Number(d.kcal || 0), 0) / loggedDays.length);
        const avgP = r0(loggedDays.reduce((s, d) => s + Number(d.p || 0), 0) / loggedDays.length);
        footText = `日均 ${avgK} kcal · 蛋白 ${avgP}g`;
      }
      trendCard.innerHTML =
        headHtml +
        `<div class="trend-body">` +
          `<div class="seg seg-sm trend-switch">` +
            `<button class="seg-btn ${days === 7 ? 'is-active' : ''}" data-act="trend-days" data-v="7">7天</button>` +
            `<button class="seg-btn ${days === 14 ? 'is-active' : ''}" data-act="trend-days" data-v="14">14天</button>` +
          `</div>` +
          `<div class="chart">${typeof svgKcal === 'function' ? svgKcal(D) : ''}</div>` +
          `<div class="chart">${typeof svgWeight === 'function' ? svgWeight(D) : ''}</div>` +
          `<div class="trend-foot">${esc(footText)}</div>` +
        `</div>`;
    }
  }
}

function renderStock() {
  const stockListEl = document.getElementById('stock-list');
  // 2.0 & 4.8：当焦点在 #stock-list 内的行内输入框时，整个跳过
  if (stockListEl && document.activeElement && document.activeElement.tagName === 'INPUT' && stockListEl.contains(document.activeElement)) {
    return;
  }

  const searchInput = document.getElementById('stock-search');
  if (searchInput && document.activeElement !== searchInput) {
    searchInput.value = UI.stockQuery || '';
  }

  // 内联新增面板
  const addPanelEl = document.getElementById('stock-add-panel');
  if (addPanelEl) {
    if (!UI.addOpen) {
      addPanelEl.hidden = true;
      addPanelEl.innerHTML = '';
    } else {
      addPanelEl.hidden = false;
      const curCat = UI.addCat || 'veg';
      const isInputActive = addPanelEl.contains(document.activeElement);
      if (!isInputActive || !document.getElementById('stock-new-name')) {
        const curInput = document.getElementById('stock-new-name');
        const curVal = curInput ? curInput.value : (UI.stockNewName || '');
        addPanelEl.innerHTML =
          `<div class="glass-card stock-add-card">` +
            `<div class="glass-well stock-new-well">` +
              `<input id="stock-new-name" class="field stock-new-input" autocomplete="off" placeholder="输入新食材或调料名称…" value="${esc(curVal)}">` +
            `</div>` +
            macroEditor('stock-new', {}, '每100g营养 · 可选，留空使用食材库数据') +
            `<div class="stock-add-bar">` +
              `<div class="seg seg-sm">` +
                `<button class="seg-btn ${curCat === 'meat' ? 'is-active' : ''}" data-act="s-add-cat" data-v="meat">肉蛋奶</button>` +
                `<button class="seg-btn ${curCat === 'veg' ? 'is-active' : ''}" data-act="s-add-cat" data-v="veg">菜果主食</button>` +
                `<button class="seg-btn ${curCat === 'spice' ? 'is-active' : ''}" data-act="s-add-cat" data-v="spice">调料</button>` +
              `</div>` +
              `<div class="stock-add-actions">` +
                `<button class="btn btn-ghost btn-sm" data-act="s-add-cancel">取消</button>` +
                `<button class="btn btn-primary btn-sm" data-act="s-add-submit">添加</button>` +
              `</div>` +
            `</div>` +
          `</div>`;
      } else {
        const segBtns = addPanelEl.querySelectorAll('.seg-btn[data-act="s-add-cat"]');
        segBtns.forEach(btn => {
          btn.classList.toggle('is-active', btn.dataset.v === curCat);
        });
      }
    }
  }

  const items = (DB && Array.isArray(DB.items)) ? DB.items : [];
  const counts = {
    all: items.length,
    meat: items.filter(it => stockCat(it) === 'meat').length,
    veg: items.filter(it => stockCat(it) === 'veg').length,
    spice: items.filter(it => it.kind === '调料' || stockCat(it) === 'spice').length,
    soon: items.filter(it => isSoon(it)).length,
    out: items.filter(it => (Number(it.qty) || 0) <= 0).length
  };

  const filterDefs = [
    ['all', '全部'],
    ['meat', '肉蛋奶'],
    ['veg', '菜果主食'],
    ['spice', '调料'],
    ['soon', '快过期'],
    ['out', '缺货']
  ];

  const curFilter = UI.stockFilter || 'all';
  const filtersEl = document.getElementById('stock-filters');
  if (filtersEl) {
    filtersEl.innerHTML = filterDefs.map(([k, label]) =>
      `<button class="pill ${curFilter === k ? 'is-active' : ''}" data-act="sf" data-v="${k}">${label}<span class="pill-count">${counts[k]}</span></button>`
    ).join('');
  }

  if (!stockListEl) return;

  const qRaw = (UI.stockQuery || '').trim();

  // 2.4.3 调料网格（筛选为「调料」且搜索框为空）
  if ((curFilter === 'spice' || curFilter === '调料') && !qRaw) {
    const groupOrder = (typeof SPICE_GROUPS !== 'undefined' && Array.isArray(SPICE_GROUPS))
      ? SPICE_GROUPS.map(g => Array.isArray(g) ? g[0] : g)
      : ['咸鲜打底', '去腥解腻', '复合香料', '辣与麻', '甜酸油脂'];
    const spiceItems = items.filter(it => it.kind === '调料' || stockCat(it) === 'spice');
    const groupsHtml = groupOrder.map(gTitle => {
      const gList = spiceItems.filter(it => spiceGroup(it) === gTitle);
      if (!gList.length) return '';
      const cellsHtml = gList.map(it => {
        const isIn = (Number(it.qty) || 0) > 0;
        const shortName = typeof spiceShort === 'function' ? spiceShort(it.name) : uiName(it.name);
        const isEditing = UI.editItem === it.id;
        if (UI.spiceManage) {
          return (
            `<div class="spice-cell is-manage ${isIn ? '' : 'is-out'} ${isEditing ? 'is-active' : ''}">` +
              `<button class="spice-name-btn" data-act="s-edit" data-id="${esc(it.id)}">` +
                `<span class="spice-name">${esc(shortName)}</span>` +
              `</button>` +
              `<span class="spice-del-x" data-act="s-del" data-id="${esc(it.id)}" role="button" aria-label="删除">×</span>` +
            `</div>`
          );
        }
        return (
          `<button class="spice-cell ${isIn ? '' : 'is-out'}" data-act="s-toggle" data-id="${esc(it.id)}">` +
            `<span class="spice-name">${esc(shortName)}</span>` +
            `<span class="spice-dot ${isIn ? 'is-in' : 'is-out'}"></span>` +
          `</button>`
        );
      }).join('');

      let editHtml = '';
      if (UI.spiceManage && UI.editItem) {
        const editingItem = gList.find(it => it.id === UI.editItem);
        if (editingItem) {
          const dName = UI.stockNames?.[editingItem.id] ?? uiName(editingItem.name);
          const cat = stockCat(editingItem);
          editHtml =
            `<div class="stock-edit stock-edit-box spice-edit">` +
              `<div class="glass-well"><input class="field stock-edit-input" data-id="${esc(editingItem.id)}" value="${esc(dName)}"></div>` +
              macroEditor('stock-' + editingItem.id, editingItem.nut?.kcal !== undefined ? editingItem.nut : getNut(editingItem.name), '每100g营养') +
              `<div class="stock-edit-bar">` +
                `<div class="seg seg-sm">` +
                  `<button class="seg-btn ${cat === 'meat' ? 'is-active' : ''}" data-act="s-cat" data-id="${esc(editingItem.id)}" data-v="meat">肉蛋奶</button>` +
                  `<button class="seg-btn ${cat === 'veg' ? 'is-active' : ''}" data-act="s-cat" data-id="${esc(editingItem.id)}" data-v="veg">菜果主食</button>` +
                  `<button class="seg-btn ${cat === 'spice' ? 'is-active' : ''}" data-act="s-cat" data-id="${esc(editingItem.id)}" data-v="spice">调料</button>` +
                `</div>` +
                `<div class="stock-edit-actions">` +
                  `<button class="btn btn-primary btn-sm" data-act="stock-edit-done" data-id="${esc(editingItem.id)}">完成</button>` +
                  `<button class="btn btn-danger btn-sm" data-act="s-del" data-id="${esc(editingItem.id)}">删</button>` +
                `</div>` +
              `</div>` +
            `</div>`;
        }
      }

      return (
        `<div class="glass-card spice-group">` +
          `<div class="spice-group-title">${esc(gTitle)}</div>` +
          `<div class="spice-grid">${cellsHtml}</div>` +
          editHtml +
        `</div>`
      );
    }).join('');

    const toolbarHtml =
      `<div class="spice-toolbar">` +
        `<span class="spice-toolbar-hint">点卡片切有/缺 · 点管理可改名或删除</span>` +
        `<button class="pill pill-sm ${UI.spiceManage ? 'is-active' : ''}" data-act="spice-manage">${UI.spiceManage ? '完成' : '管理 / 删除'}</button>` +
      `</div>`;

    stockListEl.innerHTML = toolbarHtml + (groupsHtml || `<div class="glass-card stock-list-card"><div class="empty">暂无调料</div></div>`);
    return;
  }

  // 2.4.2 食材列表
  const rowList = qRaw
    ? (typeof stockSearch === 'function' ? stockSearch(qRaw) : items)
    : items.filter(it => typeof stockMatch === 'function' ? stockMatch(it, curFilter) : true);
  const inItems = rowList.filter(it => (Number(it.qty) || 0) > 0).slice().sort((a, b) =>
    (Number(isSoon(b)) - Number(isSoon(a))) ||
    (Number(stockCat(a) === 'spice') - Number(stockCat(b) === 'spice'))
  );
  const outItems = rowList.filter(it => (Number(it.qty) || 0) <= 0);

  const exactExists = qRaw ? items.some(it => uiName(it.name) === qRaw) : true;
  const addRowHtml = (qRaw && !exactExists)
    ? `<button class="add-row" data-act="s-add">+ 加「${esc(qRaw)}」</button>`
    : '';

  const renderItemRow = (it) => {
    const isIn = (Number(it.qty) || 0) > 0;
    const soonBadge = isSoon(it) ? `<span class="badge-soon">快过期</span>` : '';
    const dName = UI.stockNames?.[it.id] ?? uiName(it.name);
    const cat = stockCat(it);
    const isEditing = UI.editItem === it.id;
    const mainRow =
      `<div class="stock-row ${isIn ? '' : 'is-out'}">` +
        `<button class="stock-name" data-act="s-edit" data-id="${esc(it.id)}">` +
          `<span class="stock-name-text">${esc(dName)}</span>` +
          soonBadge +
        `</button>` +
        `<div class="stock-actions">` +
          `<button class="status-pill ${isIn ? 'is-in' : 'is-out'}" data-act="s-toggle" data-id="${esc(it.id)}">${isIn ? '🟢 有' : '⚪ 缺'}</button>` +
          `<button class="stock-act-btn ${isEditing ? 'is-active' : ''}" data-act="s-edit" data-id="${esc(it.id)}">改</button>` +
          `<button class="stock-act-btn is-del" data-act="s-del" data-id="${esc(it.id)}">删</button>` +
        `</div>` +
      `</div>`;

    if (!isEditing) return mainRow;

    const editRow =
      `<div class="stock-edit stock-edit-box">` +
        `<div class="glass-well"><input class="field stock-edit-input" data-id="${esc(it.id)}" value="${esc(dName)}"></div>` +
        macroEditor('stock-' + it.id, it.nut?.kcal !== undefined ? it.nut : getNut(it.name), '每100g营养') +
        `<div class="stock-edit-bar">` +
          `<div class="seg seg-sm">` +
            `<button class="seg-btn ${cat === 'meat' ? 'is-active' : ''}" data-act="s-cat" data-id="${esc(it.id)}" data-v="meat">肉蛋奶</button>` +
            `<button class="seg-btn ${cat === 'veg' ? 'is-active' : ''}" data-act="s-cat" data-id="${esc(it.id)}" data-v="veg">菜果主食</button>` +
            `<button class="seg-btn ${cat === 'spice' ? 'is-active' : ''}" data-act="s-cat" data-id="${esc(it.id)}" data-v="spice">调料</button>` +
          `</div>` +
          `<div class="stock-edit-actions">` +
            `<button class="btn btn-primary btn-sm" data-act="stock-edit-done" data-id="${esc(it.id)}">完成</button>` +
            `<button class="btn btn-danger btn-sm" data-act="s-del" data-id="${esc(it.id)}">删</button>` +
          `</div>` +
        `</div>` +
      `</div>`;

    return mainRow + editRow;
  };

  const inHtml = inItems.map(renderItemRow).join('');
  const outHtml = outItems.map(renderItemRow).join('');
  const dividerHtml = (inItems.length > 0 && outItems.length > 0)
    ? `<div class="stock-divider">缺货</div>`
    : '';

  if (!addRowHtml && !inItems.length && !outItems.length) {
    stockListEl.innerHTML = `<div class="glass-card stock-list-card"><div class="empty">没有匹配的食材</div></div>`;
  } else {
    stockListEl.innerHTML =
      `<div class="glass-card stock-list-card">` +
        addRowHtml +
        inHtml +
        dividerHtml +
        outHtml +
      `</div>`;
  }
}

function renderCook() {
  const recipes = Array.isArray(RECIPES_15) ? RECIPES_15 : [];
  const canCount = recipes.filter(r => {
    const st = checkRecipeStock(r);
    return !!(st.can ?? st.canCook);
  }).length;
  const allCount = recipes.length;

  const curCf = UI.cookFilter || 'can';
  const curPot = UI.pot || '全部';
  const potList = (typeof POTS !== 'undefined' && Array.isArray(POTS))
    ? POTS
    : ['全部', '空气炸锅', '汤锅', '平底锅', '蒸锅'];

  // 2.5.1 筛选 #cook-filters
  const cookFiltersEl = document.getElementById('cook-filters');
  if (cookFiltersEl) {
    const cfHtml =
      `<div class="filter-row">` +
        `<button class="pill ${curCf === 'can' ? 'is-active' : ''}" data-act="cf" data-v="can">能做<span class="pill-count">${canCount}</span></button>` +
        `<button class="pill ${curCf === 'all' ? 'is-active' : ''}" data-act="cf" data-v="all">全部<span class="pill-count">${allCount}</span></button>` +
      `</div>`;
    const potHtml =
      `<div class="pot-row">` +
        potList.map(p =>
          `<button class="pill pill-sm ${curPot === p ? 'is-active' : ''}" data-act="pot" data-v="${esc(p)}">${esc(p)}</button>`
        ).join('') +
      `</div>`;
    cookFiltersEl.innerHTML = cfHtml + potHtml;
  }

  // 2.5.2 菜谱列表 #recipe-list
  const recipeListEl = document.getElementById('recipe-list');
  if (recipeListEl) {
    const allRows = typeof recipeRows === 'function' ? recipeRows() : recipes;
    const rows = allRows.filter(item => {
      const r = item && item.r ? item.r : item;
      const st = item && item.st ? item.st : checkRecipeStock(r);
      if (curCf === 'can' && !(st.can ?? st.canCook)) return false;
      if (curPot !== '全部' && r.potCat !== curPot && r.pot !== curPot) return false;
      return true;
    });
    if (!rows || !rows.length) {
      recipeListEl.innerHTML = `<div class="glass-card"><div class="empty">现在没有能做的</div></div>`;
    } else {
      recipeListEl.innerHTML = rows.map(item => {
        const r = item && item.r ? item.r : item;
        const st = item && item.st ? item.st : checkRecipeStock(r);
        const can = !!(st.can ?? st.canCook);
        const missText = st.missText ?? (Array.isArray(st.missing) ? st.missing.slice(0, 2).join('、') : '');
        const isOpen = UI.openRecipe === r.id;
        const title = typeof recipeTitle === 'function' ? recipeTitle(r) : r.name;
        const chips = Array.isArray(st.chips)
          ? st.chips
          : [...(st.mainList || []), ...(st.subList || [])];

        const headHtml =
          `<div class="recipe-head" data-act="r-open" data-id="${esc(r.id)}" role="button" tabindex="0">` +
            `<div class="recipe-line">` +
              `<span class="recipe-name">${esc(title)}</span>` +
              `<span class="recipe-status ${can ? 'is-can' : 'is-miss'}">${can ? '✅ 能做' : '缺: ' + esc(missText)}</span>` +
            `</div>` +
            `<div class="recipe-tags">` +
              `<span class="tag">${esc(r.pot)}</span>` +
              `<span class="tag">${r0(r.nut.kcal)} kcal · 蛋白 ${r0(r.nut.p)}g</span>` +
            `</div>` +
          `</div>`;

        if (!isOpen) {
          return `<article class="glass-card recipe-card">${headHtml}</article>`;
        }

        const chipsHtml = chips.map(c =>
          `<span class="ing-chip ${c.have ? 'is-have' : 'is-miss'}">${esc(c.label || c.text || c.n || c.name || '')}</span>`
        ).join('');

        const stepsHtml = (r.steps || []).slice(0, 3).map((stepText, idx) =>
          `<li class="step-item"><span class="step-no">${idx + 1}</span><span class="step-text">${esc(stepText)}</span></li>`
        ).join('');

        const bodyHtml =
          `<div class="recipe-body">` +
            `<div class="ing-chips">${chipsHtml}</div>` +
            `<ol class="step-list">${stepsHtml}</ol>` +
            `<div class="recipe-actions">` +
              `<button class="btn btn-primary btn-lg" data-act="r-log" data-id="${esc(r.id)}">记 1 份</button>` +
            `</div>` +
          `</div>`;

        return `<article class="glass-card recipe-card is-open">${headHtml}${bodyHtml}</article>`;
      }).join('');
    }
  }

  // 2.5.3 调味与去腥公式 #formula-card
  const formulaCard = document.getElementById('formula-card');
  if (formulaCard) {
    const isOpen = !!UI.formulaOpen;
    formulaCard.classList.toggle('is-open', isOpen);
    const headHtml =
      `<div class="formula-head" data-act="formula-toggle">` +
        `<span class="card-title">调味与去腥公式</span>` +
        `<span class="trend-summary">${isOpen ? '▾' : '▸'}</span>` +
      `</div>`;

    if (!isOpen) {
      formulaCard.innerHTML = headHtml;
    } else {
      const F = typeof FORMULA !== 'undefined' ? FORMULA : {};
      let baseText = '';
      let blanchRows = [];
      let styleRows = [];

      if (Array.isArray(F)) {
        if (F[0]) baseText = F[0].v || F[0].text || '';
        if (F[1]) blanchRows = F[1].rows || F[1].list || [];
        if (F[2]) styleRows = F[2].rows || F[2].list || [];
      } else if (F && typeof F === 'object') {
        const vals = Object.values(F);
        const strVal = vals.find(v => typeof v === 'string');
        const arrVals = vals.filter(v => Array.isArray(v));
        baseText = strVal || '';
        blanchRows = arrVals[0] || [];
        styleRows = arrVals[1] || [];
      }

      const renderFormulaRows = (arr) => arr.map(row => {
        const k = Array.isArray(row) ? row[0] : (row.k || row.name || row.t || '');
        const v = Array.isArray(row) ? row[1] : (row.v || row.desc || row.d || '');
        return `<div class="formula-row"><span class="formula-k">${esc(k)}</span><span class="formula-v">${esc(v)}</span></div>`;
      }).join('');

      formulaCard.innerHTML =
        headHtml +
        `<div class="formula-body">` +
          `<div class="formula-block">` +
            `<div class="formula-title">每 300g 肉</div>` +
            `<div class="formula-v">${esc(baseText)}</div>` +
          `</div>` +
          `<div class="formula-block">` +
            `<div class="formula-title">去腥</div>` +
            `<div class="formula-table">${renderFormulaRows(blanchRows)}</div>` +
          `</div>` +
          `<div class="formula-block">` +
            `<div class="formula-title">味型</div>` +
            `<div class="formula-table">${renderFormulaRows(styleRows)}</div>` +
          `</div>` +
        `</div>`;
    }
  }
}

function setTab(t) {
  UI.tab = t;
  history.replaceState(null, '', '#' + t);
  renderAll();
  window.scrollTo(0, 0);
}

function doParse() {
  const inputEl = document.getElementById('food-input');
  if (!inputEl) return;
  const raw = inputEl.value.trim();
  if (!raw) return;

  Object.keys(UI.drafts).filter(k => k.startsWith('pv-')).forEach(k => delete UI.drafts[k]);
  Object.keys(UI.autoCalories || {}).filter(k => k.startsWith('pv-')).forEach(k => delete UI.autoCalories[k]);
  const res = parseLocal(raw);
  UI.preview = res.items;
  renderToday();
  if (res.rest.length > 0) {
    const msg = res.rest.length > 1
      ? `没认出：${res.rest[0]} 等${res.rest.length}样`
      : `没认出：${res.rest[0]}`;
    toast(msg);
  }
}

function commitPreview() {
  if (!Array.isArray(UI.preview) || !UI.preview.length) return;
  for (let i = 0; i < UI.preview.length; i++) {
    if ((UI.preview[i].editMacros || UI.preview[i].needsNutrition) && !syncPreviewMacros(i)) return;
  }
  const items = UI.preview.slice();
  const count = items.length;
  const totalKcal = r0(items.reduce((s, x) => s + (Number(x.kcal) || 0), 0));
  const day = CUR_DAY;
  const meal = UI.meal || (typeof curMeal === 'function' ? curMeal() : 'breakfast');

  const res = logEntries(items, meal);
  const ids = _extractEntryIds(res);

  const inputEl = document.getElementById('food-input');
  if (inputEl) inputEl.value = '';
  UI.preview = [];
  renderToday();

  toast(`记下 ${count} 样 · ${totalKcal} kcal`, '撤销', () => {
    if (typeof removeEntries === 'function') removeEntries(day, ids);
    renderToday();
  });
}

function logCombo(v) {
  const day = CUR_DAY;
  if (v === 'bf') {
    const bfCombo = (FIT.combos && FIT.combos.find(c => c.fixed)) || BFC;
    const items = (bfCombo && Array.isArray(bfCombo.items)) ? bfCombo.items : [];
    if (!items.length) return;
    const totalKcal = r0(items.reduce((s, x) => s + (Number(x.kcal) || 0), 0));
    const ids = _extractEntryIds(logEntries(items, 'breakfast'));
    renderToday();
    toast(`记下 固定早餐 · ${totalKcal} kcal`, '撤销', () => {
      if (typeof removeEntries === 'function') removeEntries(day, ids);
      renderToday();
    });
    return;
  }

  if (v === 'snk') {
    const items = (typeof SNK !== 'undefined' && Array.isArray(SNK.items)) ? SNK.items : [];
    if (!items.length) return;
    const totalKcal = r0(items.reduce((s, x) => s + (Number(x.kcal) || 0), 0));
    const ids = _extractEntryIds(logEntries(items, 'snack'));
    renderToday();
    toast(`记下 4点加餐 · ${totalKcal} kcal`, '撤销', () => {
      if (typeof removeEntries === 'function') removeEntries(day, ids);
      renderToday();
    });
    return;
  }

  // 单品：查找最近一次记录并复制其克数和营养，记入当前餐次 UI.meal
  let latest = null;
  const days = Object.keys(FIT.log || {}).sort().reverse();
  for (let i = 0; i < days.length; i++) {
    const arr = FIT.log[days[i]] || [];
    for (let j = arr.length - 1; j >= 0; j--) {
      const e = arr[j];
      const eName = typeof entryName === 'function' ? entryName(e) : e.name;
      const eShort = String(eName || '').replace(/[\d.%％]+/g, '').trim() || eName;
      if (eName === v || eShort === v || e.name === v) {
        latest = e;
        break;
      }
    }
    if (latest) break;
  }

  if (!latest) return;
  const copyItem = {
    name: typeof entryName === 'function' ? entryName(latest) : latest.name,
    kcal: latest.kcal,
    p: latest.p,
    f: latest.f,
    c: latest.c,
    fb: latest.fb || 0,
    src: latest.src || 'custom'
  };
  if (Number(latest.grams) > 0) copyItem.grams = latest.grams;
  if (latest.mode) copyItem.mode = latest.mode;

  const meal = UI.meal || (typeof curMeal === 'function' ? curMeal() : 'breakfast');
  const kcal = r0(copyItem.kcal || 0);
  const ids = _extractEntryIds(logEntries([copyItem], meal));
  renderToday();
  toast(`记下 ${v} · ${kcal} kcal`, '撤销', () => {
    if (typeof removeEntries === 'function') removeEntries(day, ids);
    renderToday();
  });
}

function saveBody() {
  const wtEl = document.getElementById('wt-input');
  const actEl = document.getElementById('act-input');
  if (!FIT.wt) FIT.wt = {};
  if (!FIT.act) FIT.act = {};

  let changed = false;

  if (wtEl) {
    const rawWt = wtEl.value.trim().replace(',', '.');
    const curWt = FIT.wt[CUR_DAY] ? Number(FIT.wt[CUR_DAY].kg) : null;
    if (!rawWt) {
      if (FIT.wt[CUR_DAY]) {
        delete FIT.wt[CUR_DAY];
        changed = true;
      }
    } else {
      const val = Math.round(parseFloat(rawWt) * 10) / 10;
      if (Number.isFinite(val) && val > 0) {
        if (curWt !== val) {
          FIT.wt[CUR_DAY] = { kg: val, at: Date.now() };
          changed = true;
        }
      }
    }
  }

  if (actEl) {
    const rawAct = actEl.value.trim();
    const curAct = FIT.act[CUR_DAY] ? Number(FIT.act[CUR_DAY].kcal) : null;
    if (!rawAct) {
      if (FIT.act[CUR_DAY]) {
        delete FIT.act[CUR_DAY];
        changed = true;
      }
    } else {
      const val = r0(parseFloat(rawAct));
      if (Number.isFinite(val) && val > 0) {
        if (curAct !== val) {
          FIT.act[CUR_DAY] = { kcal: val, at: Date.now() };
          changed = true;
        }
      }
    }
  }

  if (changed) {
    fsave();
    renderToday();
  }
}

function toggleStock(id) {
  const it = DB.items.find(x => x.id === id);
  if (!it) return;
  const nextQty = (Number(it.qty) || 0) > 0 ? 0 : 1;
  const itemName = uiName(it.name);

  let prev;
  if (typeof setQty === 'function') {
    prev = setQty(id, nextQty);
  } else {
    prev = { qty: it.qty, intake: it.intake, opened: it.opened };
    it.qty = nextQty;
    if (nextQty > 0) {
      it.intake = dayKey(new Date());
      it.opened = false;
    }
    if (typeof stockChanged === 'function') stockChanged();
    else bump();
  }

  renderAll();
  toast(`${itemName} ${nextQty > 0 ? '有了' : '缺了'}`, '撤销', () => {
    const target = DB.items.find(x => x.id === id);
    if (target && prev) {
      Object.assign(target, prev);
      if (typeof stockChanged === 'function') stockChanged();
      else bump();
      renderAll();
    }
  });
}

function logRecipe(id) {
  const r = RECIPES_15.find(x => x.id === id);
  if (!r) return;
  const st = checkRecipeStock(r);
  const firstItem = st.firstItem || null;
  const title = typeof recipeTitle === 'function' ? recipeTitle(r) : r.name;
  const meal = UI.meal || (typeof curMeal === 'function' ? curMeal() : 'breakfast');
  const day = CUR_DAY;
  const kcal = r0(r.nut.kcal || 0);

  const res = logEntries([{
    name: title,
    kcal: r.nut.kcal,
    p: r.nut.p,
    f: r.nut.f,
    c: r.nut.c,
    fb: r.nut.fb || 0,
    src: 'r:' + r.id
  }], meal);

  renderAll();

        toggleStock(firstId);
      }
    });
